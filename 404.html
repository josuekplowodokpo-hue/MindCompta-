<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta Finance - Redirection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        // LOGIQUE DE REDIRECTION INTELLIGENTE
        window.onload = function() {
            const oldPath = window.location.pathname;
            const newBase = "https://mindcompta-a61ef.firebaseapp.com";
            
            // On construit la nouvelle URL
            // Si l'utilisateur était sur /services.html, il ira sur https://mindcompta-a61ef.web.app/services.html
            const targetURL = newBase + oldPath;

            // Redirection après un petit délai pour laisser l'utilisateur lire
            setTimeout(() => {
                window.location.replace(targetURL);
            }, 1500);
        };
    </script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full bg-white rounded-[40px] p-10 shadow-2xl border border-slate-100 text-center">
        <div class="mb-6 flex justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-brand-dark" style="border-top-color: #1E3A8A; border-bottom-color: #F59E0B;"></div>
        </div>

        <h1 class="text-2xl font-black text-[#1E3A8A] uppercase italic tracking-tighter mb-2">
            MindCompta Finance
        </h1>
        <p class="text-slate-500 font-bold text-xs uppercase tracking-widest mb-8">
            Déménagement du site
        </p>

        <div class="bg-slate-50 rounded-2xl p-6 mb-8">
            <p class="text-slate-600 text-sm leading-relaxed">
                Nous avons migré vers une plateforme plus rapide et sécurisée. Vous allez être redirigé automatiquement.
            </p>
        </div>

        <a id="manual-link" href="https://mindcompta-a61ef.web.app" class="inline-block bg-[#F59E0B] text-[#1E3A8A] px-8 py-3 rounded-xl font-black uppercase text-xs tracking-widest hover:scale-105 transition-transform">
            Cliquer ici si l'attente est longue
        </a>
    </div>

    <script>
        // Mise à jour dynamique du lien manuel au cas où
        document.getElementById('manual-link').href = "https://mindcompta-a61ef.web.app" + window.location.pathname;
    </script>
</body>
</html>
