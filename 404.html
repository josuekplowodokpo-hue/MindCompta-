<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MindCompta Finance - Redirection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // FORCED REDIRECTION TO THE NEW HOMEPAGE
        window.onload = function() {
            const newHome = "https://mindcompta-a61ef.firebaseapp.com/";
            
            // We use replace to avoid the "back button" loop
            setTimeout(() => {
                window.location.replace(newHome);
            }, 1000);
        };
    </script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="text-center p-10 bg-white rounded-[40px] shadow-xl border border-slate-100">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-900 mx-auto mb-4"></div>
        <h1 class="text-xl font-black text-[#1E3A8A] uppercase mb-2">MindCompta Finance</h1>
        <p class="text-slate-500 text-sm">Redirection vers notre nouvelle plateforme...</p>
    </div>
</body>
</html>
