<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture - MindCompta Finance</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E3A8A">
    <link rel="icon" type="image/jpeg" href="logo.jpg">

    <meta property="og:type" content="article">
    <meta property="og:title" id="og-title" content="Article - MindCompta Finance">
    <meta property="og:image" id="og-image" content="logo.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { --brand-dark: #1E3A8A; --accent: #F59E0B; font-family: 'Inter', sans-serif; }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        
        .skeleton { background: #eee; position: relative; overflow: hidden; border-radius: 12px; }
        .skeleton::after {
            content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        .article-body img { width: 100%; border-radius: 1.5rem; margin: 2rem 0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .article-body h2 { font-weight: 900; color: var(--brand-dark); text-transform: uppercase; margin-top: 2.5rem; border-left: 4px solid var(--accent); padding-left: 1rem; }
        .article-body p { margin-bottom: 1.5rem; color: #4b5563; line-height: 1.8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-inter">

    <main class="w-full max-w-4xl mx-auto p-4 md:p-8 flex-grow">
        <div id="loading-state" class="space-y-6 pt-20">
            <div class="skeleton h-12 w-3/4 mx-auto"></div>
            <div class="skeleton h-64 w-full rounded-[2.5rem]"></div>
        </div>

        <div id="article-view" class="hidden">
            <a href="services.html" class="inline-flex items-center text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-brand-dark my-8 transition">
                <span class="mr-2 text-lg">←</span> Revenir
            </a>

            <div class="bg-white p-6 md:p-12 rounded-[2.5rem] shadow-sm mb-10">
                <h1 id="art-title" class="text-3xl md:text-5xl font-black text-brand-dark mb-8 leading-tight"></h1>
                <div id="art-image-container"></div>
                <div id="art-content" class="article-body text-gray-700 text-lg"></div>

                <div class="flex items-center justify-between py-6 border-t border-b border-gray-100 my-8">
                    <button id="btn-share" class="bg-gray-100 px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest text-brand-dark hover:bg-accent transition">
                        Partager
                    </button>
                    <button id="btn-like" class="flex items-center gap-2 group p-2">
                        <svg id="like-icon" class="h-8 w-8 text-gray-300 transition group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                        <span id="like-count" class="font-bold text-gray-400">0</span>
                    </button>
                </div>

                <nav class="flex justify-between items-center py-4 border-t border-gray-50 mt-10">
                    <button id="prev-btn" class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-brand-dark disabled:opacity-20">← Précédent</button>
                    <button id="next-btn" class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-brand-dark disabled:opacity-20">Suivant →</button>
                </nav>
            </div>
            
            <div id="similar-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10"></div>
        </div>
    </main>

    <footer class="bg-brand-dark text-white pt-16 pb-8 px-4 mt-auto">
        <div class="max-w-6xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 mb-12">
                <div>
                    <h2 class="text-xl font-black uppercase italic">MindCompta Finance</h2>
                    <p class="text-xs text-gray-400 mt-2 leading-relaxed">Nous facilitons le quotidien des étudiant(e)s de la faculté des sciences économiques et de gestion...</p>
                </div>
                <div>
                    <h3 class="text-accent text-[10px] font-black uppercase mb-6">Services</h3>
                    <ul class="text-sm text-gray-400 space-y-4">
                        <li><a href="services.html" class="hover:text-white">Articles</a></li>
                        <li><a href="youtube.html" class="hover:text-white">Vidéos</a></li>
                    </ul>
                </div>
            </div>
            <div class="border-t border-white/10 pt-8 text-[10px] text-gray-500 uppercase font-black text-center">
                &copy; 2025 MindCompta Finance.
            </div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, query, orderBy, limit, runTransaction, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const fb = { apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0", authDomain: "mindcompta-a61ef.firebaseapp.com", projectId: "mindcompta-a61ef", storageBucket: "mindcompta-a61ef.firebasestorage.app", messagingSenderId: "578389020450", appId: "1:578389020450:web:edf9dd48e394cff7601f7b" };
        const app = initializeApp(fb); const auth = getAuth(app); const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // --- 1. SÉCURITÉ : VÉRIFICATION CONNEXION ---
        onAuthStateChanged(auth, (user) => {
            if (!user || user.isAnonymous) {
                // Redirige vers login si non connecté ou anonyme
                window.location.href = "login.html";
            } else {
                initPage(user);
            }
        });

        async function initPage(user) {
            try {
                const [artSnap, allSnap] = await Promise.all([
                    getDoc(doc(db, "resources", articleId)),
                    getDocs(query(collection(db, "resources"), orderBy("createdAt", "desc")))
                ]);

                if (artSnap.exists()) {
                    renderArticle(artSnap.data());
                    setupNavigation(allSnap.docs);
                    renderSimilar(allSnap.docs, articleId);
                    setupLikeLogic(user);

                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('article-view').classList.remove('hidden');
                }
            } catch (e) { console.error(e); }
        }

        function renderArticle(data) {
            document.getElementById('art-title').innerText = data.title;
            document.getElementById('art-content').innerHTML = data.content;
            if(data.imageUrl) document.getElementById('art-image-container').innerHTML = `<img src="${data.imageUrl}" id="main-art-img" class="rounded-3xl mb-8">`;
            document.getElementById('og-title').content = data.title;
        }

        // --- 2. LOGIQUE DU BOUTON LIKE ---
        function setupLikeLogic(user) {
            const likeIcon = document.getElementById('like-icon');
            const likeCountSpan = document.getElementById('like-count');

            // Écouter les changements en temps réel sur l'article
            onSnapshot(doc(db, "resources", articleId), (doc) => {
                likeCountSpan.innerText = doc.data().likesCount || 0;
            });

            // Vérifier si l'utilisateur a déjà liké
            onSnapshot(doc(db, "resources", articleId, "likes", user.uid), (snap) => {
                if (snap.exists()) {
                    likeIcon.classList.replace('text-gray-300', 'text-red-500');
                    likeIcon.setAttribute('fill', 'currentColor');
                } else {
                    likeIcon.classList.replace('text-red-500', 'text-gray-300');
                    likeIcon.setAttribute('fill', 'none');
                }
            });

            document.getElementById('btn-like').onclick = async () => {
                const artRef = doc(db, "resources", articleId);
                const userLikeRef = doc(db, "resources", articleId, "likes", user.uid);

                try {
                    await runTransaction(db, async (transaction) => {
                        const artDoc = await transaction.get(artRef);
                        const likeDoc = await transaction.get(userLikeRef);

                        let newCount = artDoc.data().likesCount || 0;

                        if (likeDoc.exists()) {
                            transaction.delete(userLikeRef);
                            transaction.update(artRef, { likesCount: Math.max(0, newCount - 1) });
                        } else {
                            transaction.set(userLikeRef, { uid: user.uid, date: Date.now() });
                            transaction.update(artRef, { likesCount: newCount + 1 });
                        }
                    });
                } catch (e) { console.error("Erreur Like:", e); }
            };
        }

        function setupNavigation(docs) {
            const idx = docs.findIndex(d => d.id === articleId);
            const pBtn = document.getElementById('prev-btn');
            const nBtn = document.getElementById('next-btn');

            if (idx < docs.length - 1) pBtn.onclick = () => window.location.href = `article.html?id=${docs[idx + 1].id}`;
            else pBtn.disabled = true;

            if (idx > 0) nBtn.onclick = () => window.location.href = `article.html?id=${docs[idx - 1].id}`;
            else nBtn.disabled = true;
        }

        function renderSimilar(docs, currentId) {
            const grid = document.getElementById('similar-grid');
            docs.filter(d => d.id !== currentId).slice(0, 4).forEach(ds => {
                grid.innerHTML += `
                    <a href="article.html?id=${ds.id}" class="block bg-white p-4 rounded-2xl border border-gray-100 hover:border-accent transition shadow-sm">
                        <h4 class="font-bold text-brand-dark text-xs">${ds.data().title}</h4>
                        <span class="text-[9px] text-accent font-black uppercase mt-2 block">Lire →</span>
                    </a>`;
            });
        }

        document.getElementById('btn-share').onclick = async () => {
            if(navigator.share) await navigator.share({ title: document.getElementById('art-title').innerText, url: window.location.href });
        };
    </script>
</body>
</html>
