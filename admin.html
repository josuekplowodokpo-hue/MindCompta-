<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Tableau de Bord Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            --vibrant-green: #10B981;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .admin-menu-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .admin-menu-item:hover { background-color: rgba(30, 58, 138, 0.05); border-color: var(--brand-dark); }
        .admin-menu-item.active { background-color: var(--brand-dark); color: white !important; }
        .section-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center">
                <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-3 border-2 border-white/20">
                    <span class="text-brand-dark font-black text-xl">MC</span>
                </div>
                <span class="text-xl font-bold tracking-wider">MindCompta Admin</span>
            </div>
            <div id="auth-actions-desktop"></div>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto p-4 flex-grow flex flex-col md:flex-row gap-8">
        <!-- SIDEBAR -->
        <aside class="w-full md:w-72 flex flex-col gap-2 mt-4">
            <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 px-2">Menu</h2>
            <div onclick="switchAdminTab('users')" id="menu-users" class="admin-menu-item active group bg-white shadow-sm">
                <span class="mr-3 text-xl">👥</span>
                <span class="font-bold">Utilisateurs</span>
            </div>
            <div onclick="switchAdminTab('activity')" id="menu-activity" class="admin-menu-item group text-gray-600 bg-white shadow-sm">
                <span class="mr-3 text-xl">📜</span>
                <span class="font-bold">Activités</span>
            </div>
            <div onclick="switchAdminTab('notifications')" id="menu-notifications" class="admin-menu-item group text-gray-600 bg-white shadow-sm">
                <span class="mr-3 text-xl">🔔</span>
                <span class="font-bold">Notifications</span>
            </div>
        </aside>

        <!-- CONTENU -->
        <div class="flex-grow mt-4">
            <div id="status-message" class="p-4 bg-yellow-100 text-yellow-800 rounded-2xl shadow-sm mb-6 flex items-center">
                <span class="animate-pulse mr-2">⏳</span> Synchronisation des données...
            </div>

            <!-- TAB: UTILISATEURS -->
            <section id="tab-users" class="admin-tab section-fade">
                <h1 class="text-3xl font-black text-brand-dark uppercase mb-6">Membres</h1>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase">Nom</th>
                                <th class="px-6 py-4 text-center text-[10px] font-black text-gray-400 uppercase">Statut</th>
                                <th class="px-6 py-4 text-right text-[10px] font-black text-gray-400 uppercase">Dernière Connexion</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body" class="bg-white divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </section>

            <!-- TAB: ACTIVITÉS -->
            <section id="tab-activity" class="admin-tab hidden section-fade">
                <h1 class="text-3xl font-black text-brand-dark uppercase mb-6">Logs d'Activités</h1>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-brand-dark text-white">
                            <tr>
                                <th class="px-6 py-4 text-left text-[10px] font-black uppercase">Utilisateur</th>
                                <th class="px-6 py-4 text-center text-[10px] font-black uppercase">Action</th>
                                <th class="px-6 py-4 text-right text-[10px] font-black uppercase">Heure</th>
                            </tr>
                        </thead>
                        <tbody id="activity-list-body" class="bg-white divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </section>

            <!-- TAB: NOTIFICATIONS -->
            <section id="tab-notifications" class="admin-tab hidden section-fade">
                <h1 class="text-3xl font-black text-brand-dark uppercase mb-6" id="notif-title-ui">Diffusion Cloche</h1>
                
                <!-- Formulaire Notification -->
                <div class="bg-white rounded-3xl shadow-2xl p-8 border-t-8 border-vibrant-green mb-8">
                    <div class="mb-4">
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Message à diffuser</label>
                        <textarea id="notif-text" rows="3" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-vibrant-green outline-none transition" placeholder="Tapez votre annonce ici..."></textarea>
                    </div>
                    <div class="flex items-center justify-between">
                        <div id="edit-indicator" class="hidden text-xs font-bold text-orange-500">✍️ Mode Modification</div>
                        <div class="flex gap-2">
                            <button id="cancel-edit-btn" class="hidden bg-gray-200 text-gray-600 px-6 py-3 rounded-xl font-bold text-xs uppercase transition">Annuler</button>
                            <button id="send-notif-btn" class="bg-vibrant-green text-white px-8 py-3 rounded-xl font-black uppercase text-xs tracking-widest hover:shadow-lg transition">Envoyer</button>
                        </div>
                    </div>
                    <div id="notif-status" class="mt-4 text-center hidden font-bold"></div>
                </div>

                <!-- Liste des Notifications -->
                <div id="notif-list" class="space-y-4"></div>
            </section>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mindcompta-finance';
        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";

        let currentEditId = null;

        window.switchAdminTab = (tab) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.admin-menu-item').forEach(m => m.classList.remove('active', 'bg-brand-dark', 'text-white'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`menu-${tab}`).classList.add('active', 'bg-brand-dark', 'text-white');
        };

        function formatTime(ts) {
            if (!ts) return '';
            const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return d.toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        // --- CHARGEMENT UTILISATEURS ---
        function initUsers() {
            onSnapshot(collection(db, "artifacts", appId, "public", "data", "user_profiles"), (snap) => {
                const list = document.getElementById('user-list-body');
                list.innerHTML = snap.docs.map(d => {
                    const u = d.data();
                    const isOnline = u.status === 'EN LIGNE';
                    return `<tr class="border-b border-gray-50 hover:bg-gray-50">
                        <td class="px-6 py-4 font-bold text-sm flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">${(u.username || 'U')[0]}</div>
                            ${u.username || 'Utilisateur'}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-2 py-0.5 text-[9px] font-black rounded-full uppercase ${isOnline ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'}">${u.status || 'HORS LIGNE'}</span>
                        </td>
                        <td class="px-6 py-4 text-right text-xs text-gray-400">${formatTime(u.lastLogin)}</td>
                    </tr>`;
                }).join('');
                document.getElementById('status-message').classList.add('hidden');
            });
        }

        // --- CHARGEMENT ACTIVITES ---
        function initLogs() {
            const q = query(collection(db, "artifacts", appId, "public", "data", "activity_logs"), orderBy("timestamp", "desc"), limit(50));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('activity-list-body');
                list.innerHTML = snap.docs.map(d => {
                    const l = d.data();
                    return `<tr class="border-b border-gray-50 text-xs">
                        <td class="px-6 py-4 font-bold text-brand-dark">${l.username || 'Inconnu'}</td>
                        <td class="px-6 py-4 text-center"><span class="bg-blue-100 text-blue-600 px-2 py-1 rounded font-bold">${l.action}</span></td>
                        <td class="px-6 py-4 text-right text-gray-400">${formatTime(l.timestamp)}</td>
                    </tr>`;
                }).join('');
            });
        }

        // --- GESTION NOTIFICATIONS (Boutons inclus ici) ---
        function initNotifications() {
            const q = query(collection(db, "artifacts", appId, "public", "data", "site_notifications"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('notif-list');
                list.innerHTML = snap.docs.map(d => {
                    const n = d.data();
                    return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-start group">
                        <div class="flex-1">
                            <div class="text-[10px] font-black text-gray-400 uppercase mb-1">${formatTime(n.timestamp)}</div>
                            <p class="text-sm font-medium text-gray-700">${n.text}</p>
                        </div>
                        <div class="flex gap-2 ml-4">
                            <button onclick="window.prepareEdit('${d.id}', \`${n.text.replace(/`/g, '\\`')}\`)" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition">✏️</button>
                            <button onclick="window.deleteNotification('${d.id}')" class="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-600 hover:text-white transition">🗑️</button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        // --- ACTIONS ADMIN ---
        window.deleteNotification = async (id) => {
            if(confirm("Supprimer cette notification ?")) {
                await deleteDoc(doc(db, "artifacts", appId, "public", "data", "site_notifications", id));
            }
        };

        window.prepareEdit = (id, text) => {
            currentEditId = id;
            document.getElementById('notif-text').value = text;
            document.getElementById('send-notif-btn').innerText = "Mettre à jour";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            document.getElementById('edit-indicator').classList.remove('hidden');
            document.getElementById('notif-text').focus();
        };

        document.getElementById('cancel-edit-btn').onclick = () => {
            currentEditId = null;
            document.getElementById('notif-text').value = '';
            document.getElementById('send-notif-btn').innerText = "Envoyer";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('edit-indicator').classList.add('hidden');
        };

        document.getElementById('send-notif-btn').onclick = async () => {
            const text = document.getElementById('notif-text').value.trim();
            if(!text) return;

            try {
                if(currentEditId) {
                    await updateDoc(doc(db, "artifacts", appId, "public", "data", "site_notifications", currentEditId), {
                        text: text,
                        lastModified: new Date().toISOString()
                    });
                    document.getElementById('cancel-edit-btn').click();
                } else {
                    await addDoc(collection(db, "artifacts", appId, "public", "data", "site_notifications"), {
                        text: text,
                        timestamp: new Date().toISOString(),
                        admin: "David"
                    });
                    document.getElementById('notif-text').value = '';
                }
                const st = document.getElementById('notif-status');
                st.innerText = "Succès !"; st.className = "mt-4 text-center font-bold text-green-500";
                st.classList.remove('hidden'); setTimeout(() => st.classList.add('hidden'), 2000);
            } catch(e) {
                console.error(e);
            }
        };

        // --- AUTH & INIT ---
        onAuthStateChanged(auth, async (user) => {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('auth-actions-desktop').innerHTML = `<button id="logout-btn" class="bg-red-500 text-white px-4 py-1 rounded-lg text-xs font-bold">Déconnexion</button>`;
                document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');
                initUsers(); initLogs(); initNotifications();
            } else if (!user) {
                await signInAnonymously(auth);
            } else {
                document.getElementById('status-message').innerText = "Accès non autorisé.";
            }
        });
    </script>
</body>
</html>
