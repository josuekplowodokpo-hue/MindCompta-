<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta Admin - Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 2px solid #1e40af; color: #1e40af; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">MC</div>
                <span class="font-bold text-slate-800 tracking-tight">ADMIN PANEL</span>
            </div>
            <div id="auth-status" class="text-xs font-medium text-slate-400 uppercase tracking-widest">Connexion...</div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        
        <!-- Stats Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-slate-400 text-xs font-bold uppercase mb-2">Membres Inscrits</h3>
                <p id="count-users" class="text-3xl font-black text-blue-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-slate-400 text-xs font-bold uppercase mb-2">Notifications Envoyées</h3>
                <p id="count-notifs" class="text-3xl font-black text-orange-500">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-slate-400 text-xs font-bold uppercase mb-2">Dernière Activité</h3>
                <p id="last-activity" class="text-sm font-semibold text-slate-600">Aucune</p>
            </div>
        </div>

        <!-- Navigation -->
        <div class="flex gap-6 border-b border-slate-200 mb-6">
            <button onclick="showTab('users')" id="tab-users" class="pb-3 text-sm font-bold tab-active">Utilisateurs</button>
            <button onclick="showTab('notifs')" id="tab-notifs" class="pb-3 text-sm font-bold text-slate-400">Notifications</button>
        </div>

        <!-- Tab: Users -->
        <section id="view-users" class="space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Utilisateur</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Email / Contact</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Inscrit le</th>
                        </tr>
                    </thead>
                    <tbody id="list-users" class="divide-y divide-slate-100">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Tab: Notifications -->
        <section id="view-notifs" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Notifications injected here -->
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0","authDomain":"mindcompta-a61ef.firebaseapp.com","projectId":"mindcompta-a61ef","storageBucket":"mindcompta-a61ef.firebasestorage.app","messagingSenderId":"578389020450","appId":"1:578389020450:web:edf9dd48e394cff7601f7b"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "mindcompta-a61ef";

        // Global functions for UI
        window.showTab = (tab) => {
            document.getElementById('view-users').classList.toggle('hidden', tab !== 'users');
            document.getElementById('view-notifs').classList.toggle('hidden', tab !== 'notifs');
            document.getElementById('tab-users').className = tab === 'users' ? 'pb-3 text-sm font-bold tab-active' : 'pb-3 text-sm font-bold text-slate-400';
            document.getElementById('tab-notifs').className = tab === 'notifs' ? 'pb-3 text-sm font-bold tab-active' : 'pb-3 text-sm font-bold text-slate-400';
        };

        function formatDate(ts) {
            if (!ts) return "N/A";
            const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        async function initSync() {
            // 1. Sync Registered Users
            // Use the standard path provided for public data
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
            onSnapshot(usersRef, (snapshot) => {
                const list = document.getElementById('list-users');
                document.getElementById('count-users').innerText = snapshot.size;
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
                                        ${(data.displayName || data.username || 'U').charAt(0).toUpperCase()}
                                    </div>
                                    <span class="font-semibold text-slate-700">${data.displayName || data.username || 'Inconnu'}</span>
                                </div>
                            </td>
                            <td class="p-4 text-slate-500 text-sm">${data.email || 'Pas d\'email'}</td>
                            <td class="p-4 text-slate-400 text-xs">${formatDate(data.createdAt)}</td>
                        </tr>
                    `;
                });
            }, (error) => console.error("Users sync error:", error));

            // 2. Sync Notifications (History)
            const notifsRef = collection(db, 'artifacts', appId, 'public', 'data', 'notifications');
            onSnapshot(notifsRef, (snapshot) => {
                const container = document.getElementById('view-notifs');
                document.getElementById('count-notifs').innerText = snapshot.size;
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const n = doc.data();
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-orange-50 text-orange-600 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${n.type || 'Alerte'}</span>
                                <span class="text-[10px] text-slate-400 italic">${formatDate(n.timestamp)}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">${n.title || 'Notification'}</h4>
                            <p class="text-xs text-slate-500 mt-1">${n.message || ''}</p>
                        </div>
                    `;
                });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-status').innerText = "Connecté : " + user.uid.substring(0, 8);
                initSync();
            } else {
                await signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
