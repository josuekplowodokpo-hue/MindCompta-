<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .tab-active { border-bottom: 4px solid var(--accent); color: var(--accent); font-weight: 800; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center">
                <div class="h-10 w-10 bg-white text-brand-dark rounded-xl flex items-center justify-center font-black mr-3 shadow-inner">MC</div>
                <span class="text-xl font-bold tracking-tighter">MindCompta <span class="text-yellow-400">Admin</span></span>
            </div>
            <nav class="flex items-center space-x-6">
                <button onclick="switchTab('users')" id="btn-users" class="text-xs tab-active pb-1 uppercase tracking-widest">Utilisateurs</button>
                <button onclick="switchTab('logs')" id="btn-logs" class="text-xs text-blue-200 pb-1 uppercase tracking-widest">Activités</button>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg text-[10px] font-bold transition-all">Quitter</button>
            </nav>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto p-4 flex-grow">
        
        <div id="loading-overlay" class="py-20 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-brand-dark mb-4"></div>
            <p class="text-gray-500 font-medium">Synchronisation des données...</p>
        </div>

        <!-- Section: Utilisateurs -->
        <div id="tab-users-content" class="mt-6 hidden">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h1 class="text-3xl font-black text-brand-dark">Membres</h1>
                    <p class="text-sm text-gray-500">Gestion des profils et accès</p>
                </div>
                <select id="sort-users" class="text-xs font-bold bg-white border border-gray-200 p-2 rounded-lg outline-none shadow-sm">
                    <option value="recent">Dernière connexion</option>
                    <option value="alpha">Ordre Alphabétique</option>
                </select>
            </div>

            <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-50 border-b border-gray-100">
                        <tr>
                            <th class="px-6 py-4 text-left text-[10px] font-bold text-gray-400 uppercase">Utilisateur</th>
                            <th class="px-6 py-4 text-left text-[10px] font-bold text-gray-400 uppercase">Email</th>
                            <th class="px-6 py-4 text-center text-[10px] font-bold text-gray-400 uppercase">Statut</th>
                            <th class="px-6 py-4 text-right text-[10px] font-bold text-gray-400 uppercase">Dernière Connexion</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>

        <!-- Section: Logs -->
        <div id="tab-logs-content" class="mt-6 hidden">
            <h1 class="text-3xl font-black text-brand-dark mb-2">Activités</h1>
            <p class="text-sm text-gray-500 mb-6">Suivi des lectures et téléchargements</p>
            
            <div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-brand-dark text-white">
                        <tr>
                            <th class="px-6 py-4 text-left text-[10px] font-bold uppercase">Utilisateur</th>
                            <th class="px-6 py-4 text-left text-[10px] font-bold uppercase">Action</th>
                            <th class="px-6 py-4 text-left text-[10px] font-bold uppercase">Élément</th>
                            <th class="px-6 py-4 text-right text-[10px] font-bold uppercase">Date</th>
                        </tr>
                    </thead>
                    <tbody id="activity-list-body" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let usersData = [];
        let currentTab = 'users';

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('tab-users-content').classList.toggle('hidden', tab !== 'users');
            document.getElementById('tab-logs-content').classList.toggle('hidden', tab !== 'logs');
            document.getElementById('btn-users').className = tab === 'users' ? 'text-xs tab-active pb-1 uppercase tracking-widest' : 'text-xs text-blue-200 pb-1 uppercase tracking-widest';
            document.getElementById('btn-logs').className = tab === 'logs' ? 'text-xs tab-active pb-1 uppercase tracking-widest' : 'text-xs text-blue-200 pb-1 uppercase tracking-widest';
        };

        function formatTime(ts) {
            if (!ts) return "Jamais";
            const date = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return date.toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        // SYNC UTILISATEURS
        function initUsers() {
            // Utilisation du chemin dynamique appId
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_profiles');
            onSnapshot(usersRef, (snap) => {
                usersData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers();
                document.getElementById('loading-overlay').classList.add('hidden');
                if(currentTab === 'users') document.getElementById('tab-users-content').classList.remove('hidden');
            });
        }

        function renderUsers() {
            const list = document.getElementById('user-list-body');
            const sortVal = document.getElementById('sort-users').value;
            
            const sorted = [...usersData].sort((a, b) => {
                if (sortVal === 'alpha') return (a.username || '').localeCompare(b.username || '');
                return (b.lastLogin?.seconds || 0) - (a.lastLogin?.seconds || 0);
            });

            list.innerHTML = sorted.map(u => {
                const online = u.status === 'online' || u.status === 'EN LIGNE';
                return `
                <tr class="hover:bg-blue-50/20 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs uppercase">
                                ${(u.username || 'U').charAt(0)}
                            </div>
                            <span class="font-semibold text-slate-800">${u.username || 'Anonyme'}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${u.email || 'Non fourni'}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-2 py-0.5 text-[9px] font-black rounded-md border ${online ? 'bg-green-100 text-green-700 border-green-200' : 'bg-gray-100 text-gray-400 border-gray-200'}">
                            ${online ? 'EN LIGNE' : 'HORS LIGNE'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right text-xs font-medium text-gray-400">${formatTime(u.lastLogin)}</td>
                </tr>`;
            }).join('');
        }

        // SYNC ACTIVITÉS (LOGS)
        function initLogs() {
            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'activity_logs');
            const q = query(logsRef, orderBy('timestamp', 'desc'), limit(100));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('activity-list-body');
                list.innerHTML = snap.docs.map(doc => {
                    const l = doc.data();
                    const isDl = l.action?.toLowerCase().includes('télécharg');
                    return `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 text-sm font-bold text-slate-700">${l.userEmail || l.username || 'Visiteur'}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${isDl ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}">
                                ${l.action || 'Action'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500 italic">"${l.target || 'N/A'}"</td>
                        <td class="px-6 py-4 text-right text-xs text-gray-400">${formatTime(l.timestamp)}</td>
                    </tr>`;
                }).join('');
            });
        }

        document.getElementById('sort-users').onchange = renderUsers;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                initUsers();
                initLogs();
            } else {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');
    </script>
</body>
</html>
