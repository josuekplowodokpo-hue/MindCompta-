<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Tableau de Bord Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        .tab-active { border-bottom: 4px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center">
                <div class="h-10 w-10 bg-white text-brand-dark rounded-full flex items-center justify-center font-black mr-3">MC</div>
                <span class="text-xl font-bold tracking-wider">MindCompta Admin</span>
            </div>
            <nav class="flex items-center space-x-6">
                <button onclick="switchTab('users')" id="btn-users" class="font-bold text-sm tab-active pb-1">UTILISATEURS</button>
                <button onclick="switchTab('logs')" id="btn-logs" class="font-bold text-sm text-gray-300 pb-1">ACTIVITÉS</button>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-4 py-1 rounded-full text-xs font-bold transition">Déconnexion</button>
            </nav>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto p-4 flex-grow">
        
        <!-- Tab 1: Users -->
        <div id="tab-users-content" class="mt-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black text-brand-dark uppercase">Gestion des Utilisateurs</h1>
                <div class="flex items-center bg-white px-3 py-2 rounded-lg shadow-sm border border-gray-200">
                    <span class="text-[10px] font-bold text-gray-400 mr-2 uppercase">Trier par :</span>
                    <select id="sort-users" class="text-xs font-bold text-brand-dark outline-none bg-transparent">
                        <option value="recent">Plus récent</option>
                        <option value="alpha">Ordre A-Z</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-[10px] font-black text-gray-500 uppercase">Nom</th>
                            <th class="px-6 py-3 text-left text-[10px] font-black text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-[10px] font-black text-gray-500 uppercase">Rôle</th>
                            <th class="px-6 py-3 text-center text-[10px] font-black text-gray-500 uppercase">Statut</th>
                            <th class="px-6 py-3 text-right text-[10px] font-black text-gray-500 uppercase">Dernière Connexion</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body" class="divide-y divide-gray-100">
                        <!-- Users will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab 2: Activity Logs -->
        <div id="tab-logs-content" class="mt-6 hidden">
            <h1 class="text-2xl font-black text-brand-dark uppercase mb-6">Tracé des Activités</h1>
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-brand-dark text-white">
                        <tr>
                            <th class="px-6 py-3 text-left text-[10px] font-bold uppercase">Utilisateur</th>
                            <th class="px-6 py-3 text-left text-[10px] font-bold uppercase">Action effectuée</th>
                            <th class="px-6 py-3 text-left text-[10px] font-bold uppercase">Cible (Livre/Article)</th>
                            <th class="px-6 py-3 text-right text-[10px] font-bold uppercase">Date & Heure</th>
                        </tr>
                    </thead>
                    <tbody id="activity-list-body" class="divide-y divide-gray-100">
                        <!-- Logs will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0",
            authDomain: "mindcompta-a61ef.firebaseapp.com",
            projectId: "mindcompta-a61ef",
            storageBucket: "mindcompta-a61ef.firebasestorage.app",
            messagingSenderId: "578389020450",
            appId: "1:578389020450:web:edf9dd48e394cff7601f7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "default-app-id"; // As seen in your document ID path

        let users = [];
        let userSort = 'recent';

        window.switchTab = (tab) => {
            document.getElementById('tab-users-content').classList.toggle('hidden', tab !== 'users');
            document.getElementById('tab-logs-content').classList.toggle('hidden', tab !== 'logs');
            document.getElementById('btn-users').className = tab === 'users' ? 'font-bold text-sm tab-active pb-1' : 'font-bold text-sm text-gray-300 pb-1';
            document.getElementById('btn-logs').className = tab === 'logs' ? 'font-bold text-sm tab-active pb-1' : 'font-bold text-sm text-gray-300 pb-1';
        };

        function formatFSDate(ts) {
            if (!ts) return 'Inconnu';
            const date = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // --- FETCH USERS FROM user_profiles ---
        function initUserSync() {
            const usersRef = collection(db, "artifacts", appId, "public", "data", "user_profiles");
            onSnapshot(usersRef, (snap) => {
                users = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUsers();
            });
        }

        function renderUsers() {
            const list = document.getElementById('user-list-body');
            const sorted = [...users].sort((a, b) => {
                if (userSort === 'alpha') return (a.username || '').localeCompare(b.username || '');
                return (b.lastLogin?.seconds || 0) - (a.lastLogin?.seconds || 0);
            });

            list.innerHTML = sorted.map(u => {
                const isOnline = u.status === 'EN LIGNE' || u.status === 'online';
                return `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-sm font-bold text-brand-dark">${u.username || u.displayName || 'Anonyme'}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${u.email || 'N/A'}</td>
                    <td class="px-6 py-4 text-xs font-semibold uppercase text-gray-400">${u.role || 'Client'}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-3 py-1 text-[9px] font-black rounded-full border ${isOnline ? 'bg-green-50 text-green-600 border-green-200' : 'bg-gray-50 text-gray-400 border-gray-200'}">
                            ${isOnline ? 'EN LIGNE' : 'HORS LIGNE'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right text-xs font-mono text-gray-400">${formatFSDate(u.lastLogin)}</td>
                </tr>`;
            }).join('');
        }

        // --- FETCH ACTIVITY LOGS ---
        function initActivitySync() {
            const logsRef = collection(db, "artifacts", appId, "public", "data", "activity_logs");
            const q = query(logsRef, orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snap) => {
                const list = document.getElementById('activity-list-body');
                list.innerHTML = snap.docs.map(doc => {
                    const log = doc.data();
                    const isDownload = log.action?.includes('Télécharge');
                    return `
                    <tr class="hover:bg-blue-50/50 transition">
                        <td class="px-6 py-4 text-sm font-bold text-gray-700">${log.userEmail || log.username || 'Utilisateur'}</td>
                        <td class="px-6 py-4">
                            <span class="text-xs font-bold uppercase ${isDownload ? 'text-orange-500' : 'text-blue-600'}">${log.action}</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500 italic">"${log.target || 'N/A'}"</td>
                        <td class="px-6 py-4 text-right text-xs text-gray-400 font-mono">${formatFSDate(log.timestamp)}</td>
                    </tr>`;
                }).join('');
            });
        }

        document.getElementById('sort-users').onchange = (e) => {
            userSort = e.target.value;
            renderUsers();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                initUserSync();
                initActivitySync();
            } else {
                await signInAnonymously(auth);
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');
    </script>
</body>
</html>
