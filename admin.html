<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { --brand-dark: #1E3A8A; --accent: #F59E0B; font-family: 'Inter', sans-serif; }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-brand-dark text-white p-6 shadow-xl">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="bg-white/10 p-2 rounded-lg hover:bg-white/20 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h1 class="text-xl font-black uppercase tracking-widest">Tableau de Bord Admin</h1>
            </div>
            <span class="text-accent font-bold text-xs bg-accent/10 px-3 py-1 rounded-full border border-accent/20">Accès Maître</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 w-full flex-grow">
        
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200 mb-8">
            <div class="bg-accent p-4">
                <h2 class="text-brand-dark font-black uppercase text-sm flex items-center">
                    <span class="mr-2">📢</span> Envoyer une Notification (Popup)
                </h2>
            </div>
            <div class="p-8">
                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Message de l'annonce</label>
                <textarea id="notif-text" rows="3" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-accent outline-none transition mb-4" placeholder="Ex: Une nouvelle vidéo est disponible sur la chaîne !"></textarea>
                
                <button id="send-notif-btn" class="w-full bg-brand-dark text-white font-black py-4 rounded-2xl hover:scale-[1.02] active:scale-95 transition shadow-lg uppercase tracking-widest">
                    Diffuser la notification
                </button>
                <p id="notif-status" class="mt-4 text-center hidden font-bold text-sm"></p>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl p-8 border border-gray-200">
            <h3 class="text-brand-dark font-black uppercase text-xs mb-6 flex justify-between items-center">
                Dernières notifications envoyées
                <button id="clear-notifs" class="text-red-500 hover:underline">Tout effacer</button>
            </h3>
            <div id="notifs-list" class="space-y-4">
                <p class="text-gray-400 italic text-sm">Chargement de l'historique...</p>
            </div>
        </div>

    </main>

    <footer class="p-8 text-center text-gray-400 text-[10px] font-black uppercase tracking-[0.3em]">
        MindCompta Finance &copy; 2025 - Espace Sécurisé
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0", authDomain: "mindcompta-a61ef.firebaseapp.com", projectId: "mindcompta-a61ef", storageBucket: "mindcompta-a61ef.firebasestorage.app", messagingSenderId: "578389020450", appId: "1:578389020450:web:edf9dd48e394cff7601f7b" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";
        const APP_ID = "mindcompta-finance"; // ID harmonisé

        // Vérification de sécurité
        onAuthStateChanged(auth, (user) => {
            if (!user || user.uid !== ADMIN_UID) {
                alert("Accès refusé. Redirection...");
                window.location.href = "index.html";
            }
        });

        const notifCol = collection(db, "artifacts", APP_ID, "public", "data", "site_notifications");

        // Envoyer une notification
        document.getElementById('send-notif-btn').onclick = async () => {
            const textInput = document.getElementById('notif-text');
            const status = document.getElementById('notif-status');
            
            if (!textInput.value.trim()) return alert("Le message est vide.");

            try {
                await addDoc(notifCol, {
                    text: textInput.value,
                    timestamp: new Date().toISOString(),
                    type: "announcement"
                });
                
                textInput.value = "";
                status.innerText = "Notification diffusée avec succès !";
                status.className = "mt-4 text-center font-bold text-green-600";
                status.classList.remove('hidden');
            } catch (e) {
                status.innerText = "Erreur : " + e.message;
                status.className = "mt-4 text-center font-bold text-red-500";
                status.classList.remove('hidden');
            }
            setTimeout(() => status.classList.add('hidden'), 3000);
        };

        // Liste des notifications en temps réel
        const q = query(notifCol, orderBy("timestamp", "desc"), limit(5));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('notifs-list');
            list.innerHTML = "";
            if (snap.empty) {
                list.innerHTML = "<p class='text-gray-400 italic text-sm'>Aucune notification envoyée.</p>";
                return;
            }
            snap.forEach(documentSnap => {
                const d = documentSnap.data();
                const date = new Date(d.timestamp).toLocaleString('fr-FR');
                list.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100">
                        <div>
                            <p class="text-sm text-brand-dark font-medium">${d.text}</p>
                            <p class="text-[9px] text-gray-400 uppercase font-bold mt-1">${date}</p>
                        </div>
                        <button onclick="deleteNotif('${documentSnap.id}')" class="text-red-400 hover:text-red-600 p-2">
                            &times;
                        </button>
                    </div>
                `;
            });
        });

        // Supprimer une notification spécifique
        window.deleteNotif = async (id) => {
            if(confirm("Supprimer cette notification ?")) {
                await deleteDoc(doc(db, "artifacts", APP_ID, "public", "data", "site_notifications", id));
            }
        };

        // Tout effacer
        document.getElementById('clear-notifs').onclick = async () => {
            if(confirm("Voulez-vous vraiment vider tout l'historique ?")) {
                const querySnapshot = await getDocs(notifCol);
                querySnapshot.forEach(async (d) => {
                    await deleteDoc(doc(db, "artifacts", APP_ID, "public", "data", "site_notifications", d.id));
                });
            }
        };
    </script>
</body>
</html>
