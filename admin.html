<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta Admin - Gestion & Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
        .status-online { background-color: #10b981; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
                    <span class="text-white font-black text-xl">M</span>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-none">MindCompta</h1>
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Administration Centrale</span>
                </div>
            </div>
            <div id="auth-info" class="text-xs font-mono bg-slate-100 px-3 py-1.5 rounded-full text-slate-500">
                Authentification...
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Utilisateurs</span>
                <p id="stat-users" class="text-2xl font-black text-slate-900">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Actions Aujourd'hui</span>
                <p id="stat-actions" class="text-2xl font-black text-blue-600">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Livres Téléchargés</span>
                <p id="stat-downloads" class="text-2xl font-black text-purple-600">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Commentaires</span>
                <p id="stat-comments" class="text-2xl font-black text-orange-500">0</p>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-8 border-b border-slate-200 mb-6 px-2">
            <button onclick="switchTab('users')" id="btn-users" class="pb-3 text-sm font-bold tab-active transition-all">Répertoire Utilisateurs</button>
            <button onclick="switchTab('logs')" id="btn-logs" class="pb-3 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all">Journaux d'Activité (Logs)</button>
        </div>

        <!-- View: Users -->
        <section id="view-users" class="space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-4 text-[11px] font-black text-slate-400 uppercase">Membre</th>
                            <th class="p-4 text-[11px] font-black text-slate-400 uppercase">Coordonnées</th>
                            <th class="p-4 text-[11px] font-black text-slate-400 uppercase text-center">Statut / Connexion</th>
                        </tr>
                    </thead>
                    <tbody id="users-body" class="divide-y divide-slate-100">
                        <!-- User rows -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- View: Logs -->
        <section id="view-logs" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-700 uppercase tracking-tight">Flux des actions en temps réel</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50/50">
                            <tr>
                                <th class="p-4 text-[11px] font-black text-slate-400 uppercase">Heure</th>
                                <th class="p-4 text-[11px] font-black text-slate-400 uppercase">Utilisateur</th>
                                <th class="p-4 text-[11px] font-black text-slate-400 uppercase">Action</th>
                                <th class="p-4 text-[11px] font-black text-slate-400 uppercase">Cible (Article/Livre)</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body" class="divide-y divide-slate-100">
                            <!-- Log rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0","authDomain":"mindcompta-a61ef.firebaseapp.com","projectId":"mindcompta-a61ef","storageBucket":"mindcompta-a61ef.firebasestorage.app","messagingSenderId":"578389020450","appId":"1:578389020450:web:edf9dd48e394cff7601f7b"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "mindcompta-a61ef";

        // Tab Switching Logic
        window.switchTab = (tab) => {
            document.getElementById('view-users').classList.toggle('hidden', tab !== 'users');
            document.getElementById('view-logs').classList.toggle('hidden', tab !== 'logs');
            document.getElementById('btn-users').className = tab === 'users' ? 'pb-3 text-sm font-bold tab-active' : 'pb-3 text-sm font-bold text-slate-400';
            document.getElementById('btn-logs').className = tab === 'logs' ? 'pb-3 text-sm font-bold tab-active' : 'pb-3 text-sm font-bold text-slate-400';
        };

        function formatDateTime(ts) {
            if (!ts) return "Jamais";
            const date = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function getActionBadge(action) {
            const act = action.toLowerCase();
            if (act.includes('télécharge')) return 'bg-purple-100 text-purple-700';
            if (act.includes('commente')) return 'bg-orange-100 text-orange-700';
            if (act.includes('lit')) return 'bg-blue-100 text-blue-700';
            return 'bg-slate-100 text-slate-700';
        }

        async function startMonitoring() {
            // 1. Monitor Users
            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
            onSnapshot(usersRef, (snapshot) => {
                const body = document.getElementById('users-body');
                document.getElementById('stat-users').innerText = snapshot.size;
                body.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const u = doc.data();
                    const isOnline = u.status === 'online';
                    body.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="relative">
                                        <div class="w-9 h-9 bg-slate-200 rounded-full flex items-center justify-center font-bold text-slate-600">
                                            ${(u.displayName || u.username || 'U').charAt(0).toUpperCase()}
                                        </div>
                                        ${isOnline ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>' : ''}
                                    </div>
                                    <div>
                                        <div class="font-bold text-slate-800 text-sm">${u.displayName || u.username || 'Utilisateur'}</div>
                                        <div class="text-[10px] text-slate-400 uppercase font-medium">ID: ${doc.id.substring(0,6)}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-4">
                                <div class="text-sm text-slate-600 font-medium">${u.email || 'N/A'}</div>
                            </td>
                            <td class="p-4 text-center">
                                <div class="text-[11px] font-bold text-slate-500">${formatDateTime(u.lastLogin)}</div>
                                <div class="text-[9px] ${isOnline ? 'text-green-600' : 'text-slate-400'} uppercase font-black">${isOnline ? 'Connecté' : 'Déconnecté'}</div>
                            </td>
                        </tr>
                    `;
                });
            });

            // 2. Monitor Logs (Actions)
            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'logs');
            onSnapshot(logsRef, (snapshot) => {
                const body = document.getElementById('logs-body');
                let countDl = 0, countCm = 0;
                
                // Clear and sort (simple memory sort)
                const docs = [];
                snapshot.forEach(d => docs.push(d.data()));
                docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                body.innerHTML = '';
                docs.forEach(l => {
                    if (l.action?.includes('télécharge')) countDl++;
                    if (l.action?.includes('commente')) countCm++;
                    
                    body.innerHTML += `
                        <tr class="text-sm border-b border-slate-50">
                            <td class="p-4 text-slate-400 font-mono text-xs">${formatDateTime(l.timestamp)}</td>
                            <td class="p-4 font-bold text-slate-700">${l.username || 'Anonyme'}</td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded-md text-[10px] font-black uppercase ${getActionBadge(l.action || '')}">
                                    ${l.action || 'Action'}
                                </span>
                            </td>
                            <td class="p-4 text-slate-600 italic">"${l.target || 'N/A'}"</td>
                        </tr>
                    `;
                });

                document.getElementById('stat-actions').innerText = snapshot.size;
                document.getElementById('stat-downloads').innerText = countDl;
                document.getElementById('stat-comments').innerText = countCm;
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-info').innerText = "Admin UID: " + user.uid.substring(0, 8);
                startMonitoring();
            } else {
                await signInAnonymously(auth);
            }
        });
    </script>
</body>
</html>
