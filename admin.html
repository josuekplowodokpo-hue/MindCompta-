<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Admin Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .tab-active { color: #1e3a8a; border-bottom: 3px solid #1e3a8a; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="glass sticky top-0 z-50 border-b border-gray-200 p-4 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-900 rounded-xl flex items-center justify-center text-white font-bold">MC</div>
                <h1 class="font-extrabold text-xl tracking-tight text-blue-900">ADMIN CONTROL</h1>
            </div>
            <button id="logout-btn" class="text-sm font-bold text-red-600 bg-red-50 px-4 py-2 rounded-lg hover:bg-red-100 transition">Quitter</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4">

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold text-gray-400 uppercase">Membres</p>
                <p id="stat-users" class="text-2xl font-black text-blue-900">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold text-gray-400 uppercase">Commentaires</p>
                <p id="stat-comments" class="text-2xl font-black text-blue-600">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold text-gray-400 uppercase">Journal</p>
                <p id="stat-logs" class="text-2xl font-black text-emerald-600">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-xs font-semibold text-gray-400 uppercase">Annonces</p>
                <p id="stat-announces" class="text-2xl font-black text-orange-500">0</p>
            </div>
        </div>

        <div class="flex gap-8 border-b border-gray-200 mb-6 px-2">
            <button onclick="switchTab('users')" id="btn-users" class="pb-3 text-sm font-bold tab-active">MEMBRES DÉTAILLÉS</button>
            <button onclick="switchTab('logs')" id="btn-logs" class="pb-3 text-sm font-bold text-gray-400 hover:text-gray-600">JOURNAL D'ACTIVITÉ</button>
        </div>

        <section id="sec-users" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[900px]">
                    <thead class="bg-gray-50 text-gray-400 text-[10px] font-bold uppercase">
                        <tr>
                            <th class="p-4">Utilisateur</th>
                            <th class="p-4">E-mail</th>
                            <th class="p-4">Date de Création</th>
                            <th class="p-4">Dernière Connexion</th>
                            <th class="p-4 text-right">Statut</th>
                        </tr>
                    </thead>
                    <tbody id="users-list" class="divide-y divide-gray-50 text-sm">
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <section id="sec-logs" class="tab-content hidden space-y-4">
            <div id="activity-feed" class="space-y-3"></div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse('{"apiKey":"AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0","authDomain":"mindcompta-a61ef.firebaseapp.com","projectId":"mindcompta-a61ef","storageBucket":"mindcompta-a61ef.firebasestorage.app","messagingSenderId":"578389020450","appId":"1:578389020450:web:edf9dd48e394cff7601f7b"}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "mindcompta-a61ef";

        window.switchTab = (target) => {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`sec-${target}`).classList.remove('hidden');
            document.getElementById(`btn-${target}`).classList.add('tab-active');
        };

        function formatDate(ts) {
            if (!ts) return "--";
            const date = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function initSync() {
            // Listen for any activity to find user IDs
            const activityRef = collection(db, 'activity_logs');
            const userRegistry = new Set();

            onSnapshot(query(activityRef, orderBy("timestamp", "desc")), (snap) => {
                const list = document.getElementById('users-list');
                const feed = document.getElementById('activity-feed');
                feed.innerHTML = '';
                
                snap.forEach(actionDoc => {
                    const action = actionDoc.data();
                    const uid = action.userId;
                    
                    // Display activity log
                    feed.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                            <p class="text-xs font-bold text-gray-400 uppercase">${formatDate(action.timestamp)}</p>
                            <p class="text-sm text-gray-800">${action.action || 'Action inconnue'}</p>
                            <p class="text-[10px] text-gray-400">UID: ${uid || 'N/A'}</p>
                        </div>
                    `;

                    // If we find a new user ID, try to get their specific profile
                    if (uid && !userRegistry.has(uid)) {
                        userRegistry.add(uid);
                        syncUserProfile(uid);
                    }
                });
                document.getElementById('stat-logs').innerText = snap.size;
                document.getElementById('stat-users').innerText = userRegistry.size;
            });
        }

        function syncUserProfile(uid) {
            // Path: /artifacts/{appId}/users/{userId}/profile/info
            // Note: We use 'info' as the document name inside the private profile collection
            const profileRef = doc(db, 'artifacts', appId, 'users', uid, 'profile', 'info');
            
            onSnapshot(profileRef, (pSnap) => {
                const list = document.getElementById('users-list');
                const p = pSnap.exists() ? pSnap.data() : null;
                
                let row = document.getElementById(`row-${uid}`);
                if (!row) {
                    row = document.createElement('tr');
                    row.id = `row-${uid}`;
                    row.className = "hover:bg-gray-50 transition";
                    list.appendChild(row);
                }

                if (p) {
                    row.innerHTML = `
                        <td class="p-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
                                    ${(p.username || 'U').charAt(0).toUpperCase()}
                                </div>
                                <div class="flex flex-col">
                                    <span class="font-bold text-blue-900">${p.username || 'Anonyme'}</span>
                                    <span class="text-[10px] text-gray-400 font-mono">${uid}</span>
                                </div>
                            </div>
                        </td>
                        <td class="p-4 text-gray-600">${p.email || 'Non renseigné'}</td>
                        <td class="p-4 text-gray-500 text-xs">${formatDate(p.createdAt)}</td>
                        <td class="p-4 text-gray-500 text-xs font-semibold">${formatDate(p.lastLogin)}</td>
                        <td class="p-4 text-right">
                            <span class="px-2 py-1 bg-green-50 text-green-600 text-[10px] font-bold rounded-full border border-green-100">ACTIF</span>
                        </td>
                    `;
                } else {
                    // Fallback if profile doc is missing but user exists in logs
                    row.innerHTML = `
                        <td class="p-4 font-mono text-[10px] text-gray-400">${uid}</td>
                        <td class="p-4 text-gray-400 italic">Profil non initialisé</td>
                        <td class="p-4 text-gray-300">--</td>
                        <td class="p-4 text-gray-300">--</td>
                        <td class="p-4 text-right">
                            <span class="px-2 py-1 bg-gray-100 text-gray-400 text-[10px] font-bold rounded-full">EN ATTENTE</span>
                        </td>
                    `;
                }
            }, (err) => console.error("Error fetching profile for " + uid, err));
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                await signInAnonymously(auth);
            } else {
                // In a real app, you'd check if user.uid is the admin UID here
                initSync();
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');
    </script>
</body>
</html>
