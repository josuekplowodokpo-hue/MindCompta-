<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Tableau de Bord Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            --vibrant-green: #10B981;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .admin-menu-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .admin-menu-item.active {
            background-color: var(--brand-dark);
            color: white !important;
        }
        .section-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center">
                <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-3 border-2 border-white/20">
                    <span class="text-brand-dark font-black text-xl">MC</span>
                </div>
                <span class="text-xl font-bold tracking-wider">MindCompta Admin</span>
            </div>
            <div id="auth-actions-desktop"></div>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto p-4 flex-grow flex flex-col md:flex-row gap-8">
        <aside class="w-full md:w-72 flex flex-col gap-2 mt-4">
            <h2 class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 px-2 text-center md:text-left">Navigation</h2>
            <div onclick="switchAdminTab('users')" id="menu-users" class="admin-menu-item active group bg-white shadow-sm">
                <span class="mr-3 text-xl">👥</span>
                <span class="font-bold">Utilisateurs</span>
            </div>
            <div onclick="switchAdminTab('activity')" id="menu-activity" class="admin-menu-item group text-gray-600 bg-white shadow-sm">
                <span class="mr-3 text-xl">📜</span>
                <span class="font-bold">Activités</span>
            </div>
            <div onclick="switchAdminTab('notifications')" id="menu-notifications" class="admin-menu-item group text-gray-600 bg-white shadow-sm">
                <span class="mr-3 text-xl">🔔</span>
                <span class="font-bold">Notifications</span>
            </div>
        </aside>

        <div class="flex-grow mt-4">
            <div id="status-message" class="p-4 bg-yellow-100 text-yellow-800 rounded-2xl shadow-sm mb-6 flex items-center">
                <span class="animate-pulse mr-2">⏳</span> Synchronisation...
            </div>

            <section id="tab-users" class="admin-tab section-fade">
                <h1 class="text-3xl font-black text-brand-dark uppercase mb-6">Utilisateurs</h1>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase">Utilisateur</th>
                                <th class="px-6 py-4 text-left text-[10px] font-black text-gray-400 uppercase text-center">Statut</th>
                                <th class="px-6 py-4 text-right text-[10px] font-black text-gray-400 uppercase">Dernière Connexion</th>
                            </tr>
                        </thead>
                        <tbody id="user-list" class="bg-white divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-activity" class="admin-tab hidden section-fade">
                <h1 class="text-3xl font-black text-brand-dark uppercase mb-6">Activités</h1>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-brand-dark text-white">
                            <tr>
                                <th class="px-6 py-4 text-left text-[10px] font-black uppercase">Utilisateur</th>
                                <th class="px-6 py-4 text-left text-[10px] font-black uppercase text-center">Action</th>
                                <th class="px-6 py-4 text-right text-[10px] font-black uppercase">Date</th>
                            </tr>
                        </thead>
                        <tbody id="activity-list" class="bg-white divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-notifications" class="admin-tab hidden section-fade">
                <h1 class="text-3xl font-black text-brand-dark uppercase mb-6">Notifications</h1>
                <div class="bg-white rounded-3xl shadow-2xl p-8 border-t-8 border-vibrant-green">
                    <textarea id="notif-text" rows="4" class="w-full p-5 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-vibrant-green outline-none transition mb-4" placeholder="Votre message public..."></textarea>
                    <div class="flex justify-end">
                        <button id="send-notif-btn" class="bg-vibrant-green text-white px-10 py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-emerald-600 transition">Diffuser</button>
                    </div>
                    <div id="notif-status" class="mt-4 text-center hidden font-bold"></div>
                </div>
            </section>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Dynamic App ID is mandatory for security rules
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mindcompta-finance';
        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";

        window.switchAdminTab = (tabName) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.admin-menu-item').forEach(m => m.classList.remove('active', 'bg-brand-dark', 'text-white'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`menu-${tabName}`).classList.add('active', 'bg-brand-dark', 'text-white');
        };

        function formatFSDate(ts) {
            if (!ts) return 'N/A';
            const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return d.toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        // --- FETCH USERS (Correction: Path must use appId) ---
        function initData() {
            onSnapshot(collection(db, "artifacts", appId, "public", "data", "user_profiles"), (snap) => {
                const list = document.getElementById('user-list');
                list.innerHTML = snap.docs.map(docSnap => {
                    const u = docSnap.data();
                    const online = u.status === 'EN LIGNE' || u.status === 'online';
                    return `
                        <tr class="hover:bg-gray-50 border-b border-gray-50">
                            <td class="px-6 py-4 flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center font-bold text-blue-800 text-xs">${(u.username || 'U')[0]}</div>
                                <span class="text-sm font-bold">${u.username || u.displayName || 'Anonyme'}</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span class="px-2 py-0.5 text-[9px] font-black rounded-full uppercase ${online ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'}">
                                    ${online ? 'EN LIGNE' : 'HORS LIGNE'}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right text-xs text-gray-400 font-medium">${formatFSDate(u.lastLogin)}</td>
                        </tr>`;
                }).join('');
                document.getElementById('status-message').classList.add('hidden');
            });

            onSnapshot(query(collection(db, "artifacts", appId, "public", "data", "activity_logs"), orderBy("timestamp", "desc")), (snap) => {
                const list = document.getElementById('activity-list');
                list.innerHTML = snap.docs.map(docSnap => {
                    const log = docSnap.data();
                    return `<tr class="hover:bg-gray-50 text-xs">
                        <td class="px-6 py-4 font-bold">${log.username || 'Visiteur'}</td>
                        <td class="px-6 py-4 text-center"><span class="bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold">${log.action}</span></td>
                        <td class="px-6 py-4 text-right text-gray-400">${formatTime(log.timestamp)}</td>
                    </tr>`;
                }).join('');
            });
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        // --- NOTIFICATION FIX ---
        document.getElementById('send-notif-btn').onclick = async () => {
            const btn = document.getElementById('send-notif-btn');
            const input = document.getElementById('notif-text');
            const status = document.getElementById('notif-status');
            const text = input.value.trim();

            if (!text) return;
            btn.disabled = true;

            try {
                // FIXED PATH: Uses the appId and compliant collection structure
                const notifRef = collection(db, "artifacts", appId, "public", "data", "site_notifications");
                await addDoc(notifRef, {
                    text: text,
                    timestamp: new Date().toISOString(),
                    author: "Admin",
                    type: "global"
                });

                status.innerText = "Notification envoyée !";
                status.className = "mt-4 text-center font-bold text-green-600";
                input.value = '';
            } catch (e) {
                console.error(e);
                status.innerText = "Erreur: Vérifiez vos droits d'accès.";
                status.className = "mt-4 text-center font-bold text-red-500";
            } finally {
                status.classList.remove('hidden');
                btn.disabled = false;
                setTimeout(() => status.classList.add('hidden'), 3000);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('auth-actions-desktop').innerHTML = `<button id="logout-btn" class="bg-red-500 text-white py-1 px-4 text-[10px] font-black uppercase rounded-lg">Quitter</button>`;
                document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');
                initData();
            } else if (!user) {
                await signInAnonymously(auth);
            } else {
                document.getElementById('status-message').innerHTML = `<span class="text-red-600 font-bold">Accès Admin Requis</span>`;
            }
        });
    </script>
</body>
</html>
