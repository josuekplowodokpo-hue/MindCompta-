<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Vidéos YouTube</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        :root {
            --brand-dark: #1E3A8A; 
            --accent: #F59E0B; 
            --vibrant-green: #10B981; 
            font-family: 'Inter', sans-serif;
        }

        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        .hover-accent:hover { background-color: #D97706; } 
        .bg-vibrant-green { background-color: var(--vibrant-green); }

        .nav-link { color: white; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: 0.2s; }
        .nav-link:hover { background-color: #345b85; }
        .active-link-desktop { background-color: var(--accent); font-weight: 600; color: var(--brand-dark) !important; }

        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; z-index: 50; }
        #mobile-menu.open { transform: translateX(0); }
        #mobile-menu-overlay { display: none; z-index: 40; position: fixed; inset: 0; background: rgba(0,0,0,0.5); }
        #mobile-menu-overlay.open { display: block; }
        
        .mobile-link { display: block; padding: 0.75rem 1rem; color: white; font-weight: 500; border-radius: 0.5rem; }
        .mobile-link.active-link-mobile { background-color: var(--accent); color: var(--brand-dark); font-weight: 700; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="logo.jpg" alt="Logo" class="h-10 w-auto rounded-full mr-3 border-2 border-white group-hover:scale-105 transition">
                <span class="text-xl font-bold tracking-wider">MindCompta Finance</span>
            </a>

            <nav class="hidden sm:flex items-center space-x-4">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="services.html" class="nav-link">Services (Livre)</a>
                <a href="about.html" class="nav-link">À Propos</a>
                <a href="youtube.html" class="nav-link active-link-desktop">Vidéos YouTube</a>
                <div id="auth-actions-desktop" class="flex items-center ml-4 pl-4 border-l border-blue-800"></div>
            </nav>

            <button id="menu-button" class="sm:hidden p-2"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        </div>
    </header>

    <div id="mobile-menu-overlay"></div>
    <nav id="mobile-menu" class="fixed top-0 right-0 w-64 h-full bg-brand-dark text-white shadow-2xl z-50 p-6 flex flex-col">
        <button id="close-menu-button" class="text-4xl self-end mb-8">&times;</button>
        <div class="space-y-3">
            <a href="index.html" class="mobile-link">Accueil</a>
            <a href="services.html" class="mobile-link">Services (Livre)</a>
            <a href="about.html" class="mobile-link">À Propos</a>
            <a href="youtube.html" class="mobile-link active-link-mobile">Vidéos YouTube</a>
        </div>
        <div id="auth-actions-mobile" class="mt-auto pt-6 border-t border-gray-700 space-y-3 text-center"></div>
    </nav>

    <main class="w-full max-w-6xl mx-auto p-4 flex-grow py-12">
        <div id="admin-section" class="bg-white p-6 rounded-2xl shadow-lg mb-12 border-2 border-accent hidden">
            <h2 class="text-xl font-bold text-brand-dark mb-4">Ajouter une Vidéo</h2>
            <form id="add-video-form" class="space-y-3">
                <input type="text" id="v-title" required class="w-full border p-2 rounded" placeholder="Titre de la vidéo">
                <input type="text" id="v-id" required class="w-full border p-2 rounded" placeholder="ID YouTube (ex: dQw4w9WgXcQ)">
                <textarea id="v-desc" class="w-full border p-2 rounded" placeholder="Description courte"></textarea>
                <button type="submit" class="w-full bg-brand-dark text-white font-bold py-2 rounded">PUBLIER LA VIDÉO</button>
            </form>
        </div>

        <div class="text-center mb-16">
            <h1 class="text-4xl font-extrabold text-brand-dark mb-4">Vidéos YouTube</h1>
            <p class="text-gray-600">Apprenez le Droit OHADA en vidéo.</p>
        </div>

        <div id="videos-list" class="grid md:grid-cols-2 gap-8">
            <div id="loader" class="col-span-2 flex justify-center py-10"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-accent"></div></div>
        </div>

        <div class="text-center mt-12">
            <a href="https://www.youtube.com/@VOTRE_CHAINE" class="inline-flex items-center bg-red-500 text-white font-bold py-3 px-8 rounded-full shadow-xl hover:bg-red-600 transition">
                Voir toute la chaîne
            </a>
        </div>
    </main>

    <footer class="w-full bg-brand-dark py-6 mt-auto">
        <p class="text-center text-sm text-gray-400">&copy; 2025 MindCompta. Tous droits réservés.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const fb = { apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0", authDomain: "mindcompta-a61ef.firebaseapp.com", projectId: "mindcompta-a61ef", storageBucket: "mindcompta-a61ef.firebasestorage.app", messagingSenderId: "578389020450", appId: "1:578389020450:web:edf9dd48e394cff7601f7b" };
        const app = initializeApp(fb); const auth = getAuth(app); const db = getFirestore(app);
        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";
        setPersistence(auth, browserSessionPersistence);

        onAuthStateChanged(auth, (user) => {
            const dActions = document.getElementById('auth-actions-desktop');
            const mActions = document.getElementById('auth-actions-mobile');
            if (user) {
                const name = user.email.split('@')[0];
                const isAdmin = user.uid === ADMIN_UID;
                const logoutBtn = `<div class="flex flex-col items-center"><span class="text-accent text-[10px] font-bold">${name}</span><button onclick="window.fbLogout()" class="bg-red-600 px-3 py-1 rounded text-white text-[10px] font-bold uppercase">Quitter</button></div>`;
                
                dActions.innerHTML = logoutBtn;
                mActions.innerHTML = `<p class="text-accent text-xs font-bold">Connecté : ${name}</p><button onclick="window.fbLogout()" class="mobile-link bg-red-600 text-center font-bold">Déconnexion</button>`;
                
                if (isAdmin) document.getElementById('admin-section').classList.remove('hidden');
                loadVideos(isAdmin);
            } else {
                const loginBtn = `<a href="login.html" class="bg-accent py-2 px-5 text-sm font-bold rounded-full text-white">Se Connecter</a>`;
                dActions.innerHTML = loginBtn;
                mActions.innerHTML = `<a href="login.html" class="mobile-link bg-accent text-brand-dark text-center font-bold">Se Connecter</a>`;
                loadVideos(false);
            }
        });

        window.fbLogout = () => signOut(auth).then(() => window.location.reload());

        function loadVideos(isAdmin) {
            onSnapshot(query(collection(db, "youtube_videos"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('videos-list'); list.innerHTML = '';
                document.getElementById('loader')?.remove();
                snap.forEach((ds) => {
                    const v = ds.data(); const id = ds.id;
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200";
                    card.innerHTML = `
                        <div class="aspect-video">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${v.youtubeId}" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start">
                                <h3 class="text-lg font-bold text-brand-dark mb-2">${v.title}</h3>
                                ${isAdmin ? `<button onclick="window.delVideo('${id}')" class="text-red-500 text-[10px] font-bold">SUPPRIMER</button>` : ''}
                            </div>
                            <p class="text-gray-600 text-xs">${v.description || ''}</p>
                        </div>`;
                    list.appendChild(card);
                });
            });
        }

        document.getElementById('add-video-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "youtube_videos"), {
                title: document.getElementById('v-title').value,
                youtubeId: document.getElementById('v-id').value,
                description: document.getElementById('v-desc').value,
                createdAt: serverTimestamp()
            });
            e.target.reset();
        };

        window.delVideo = async (id) => { if(confirm("Supprimer cette vidéo ?")) await deleteDoc(doc(db, "youtube_videos", id)); };

        // Mobile Menu logic
        const menu = document.getElementById('mobile-menu');
        const overlay = document.getElementById('mobile-menu-overlay');
        document.getElementById('menu-button').onclick = () => { menu.classList.add('open'); overlay.classList.add('open'); };
        document.getElementById('close-menu-button').onclick = () => { menu.classList.remove('open'); overlay.classList.remove('open'); };
        overlay.onclick = () => { menu.classList.remove('open'); overlay.classList.remove('open'); };
    </script>
</body>
</html>
