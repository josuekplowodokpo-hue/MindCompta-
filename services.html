<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Ressources & Documents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            --vibrant-green: #10B981;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        .hover-accent:hover { background-color: #D97706; }
        .nav-link { color: white; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: 0.2s; }
        .nav-link:hover { background-color: #345b85; }
        .active-link-desktop { background-color: var(--accent); color: var(--brand-dark) !important; font-weight: 600; }
        #mobile-menu { transform: translateX(100%); transition: 0.3s; z-index: 50; }
        #mobile-menu.open { transform: translateX(0); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'" class="h-10 w-auto rounded-full mr-3 border-2 border-white transition group-hover:scale-105">
                <span class="text-xl font-bold tracking-wider group-hover:text-accent">MindCompta</span>
            </a>
            <nav class="hidden sm:flex items-center space-x-4">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="services.html" class="nav-link active-link-desktop">Services</a>
                <a href="about.html" class="nav-link">À Propos</a>
                <div id="auth-actions-desktop" class="flex items-center space-x-3 ml-4"></div>
            </nav>
            <button id="menu-button" class="sm:hidden p-2"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto p-4 flex-grow">
        <h1 class="text-4xl font-extrabold text-brand-dark mb-8 mt-4 border-b pb-2 border-accent">Ressources Documentaires</h1>

        <div id="login-required-message" class="bg-white p-10 rounded-xl shadow-lg text-center my-10 hidden">
            <h2 class="text-2xl font-bold text-red-600 mb-4">Accès Réservé</h2>
            <p class="text-gray-600 mb-6">Connectez-vous pour accéder à votre bibliothèque de documents comptables.</p>
            <a href="login.html" class="bg-brand-dark text-white px-8 py-3 rounded-full font-bold hover:bg-opacity-90 transition">Se Connecter</a>
        </div>

        <div id="admin-add-section" class="bg-white p-6 rounded-xl shadow-md mb-10 border-t-4 border-accent hidden">
            <h2 class="text-xl font-bold text-brand-dark mb-4">Ajouter un nouveau document</h2>
            <form id="add-doc-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="doc-title" placeholder="Titre du document" required class="border p-2 rounded">
                <input type="url" id="doc-url" placeholder="Lien du PDF (Google Drive, Dropbox, etc)" required class="border p-2 rounded">
                <button type="submit" class="bg-vibrant-green text-white font-bold py-2 px-4 rounded hover:opacity-90">Publier le document</button>
            </form>
        </div>

        <div id="documents-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            </div>

        <div id="loading-spinner" class="text-center py-20">
            <p class="text-gray-500 animate-pulse">Chargement des ressources...</p>
        </div>
    </main>

    <footer class="w-full bg-brand-dark border-t border-gray-700 py-6 mt-auto">
        <p class="text-center text-sm text-gray-400">&copy; 2025 MindCompta. Tous droits réservés.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0",
            authDomain: "mindcompta-a61ef.firebaseapp.com",
            projectId: "mindcompta-a61ef",
            storageBucket: "mindcompta-a61ef.firebasestorage.app",
            messagingSenderId: "578389020450",
            appId: "1:578389020450:web:edf9dd48e394cff7601f7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";

        // DOM Elements
        const docGrid = document.getElementById('documents-grid');
        const loginMessage = document.getElementById('login-required-message');
        const adminSection = document.getElementById('admin-add-section');
        const loadingSpinner = document.getElementById('loading-spinner');
        const authActions = document.getElementById('auth-actions-desktop');

        onAuthStateChanged(auth, (user) => {
            loadingSpinner.classList.add('hidden');
            if (user) {
                // Connecté
                loginMessage.classList.add('hidden');
                docGrid.classList.remove('hidden');
                renderAuthUI(user);
                loadDocuments();
                
                // Si admin, montrer le formulaire
                if (user.uid === ADMIN_UID) {
                    adminSection.classList.remove('hidden');
                }
            } else {
                // Déconnecté
                loginMessage.classList.remove('hidden');
                docGrid.classList.add('hidden');
                authActions.innerHTML = `<a href="login.html" class="bg-accent px-4 py-2 rounded-full text-brand-dark font-bold">Connexion</a>`;
            }
        });

        function renderAuthUI(user) {
            authActions.innerHTML = `
                <span class="text-xs text-gray-300">${user.email}</span>
                <button id="logout-btn" class="text-red-400 text-sm font-bold underline">Quitter</button>
            `;
            document.getElementById('logout-btn').onclick = () => signOut(auth);
        }

        // AJOUTER UN DOCUMENT (ADMIN)
        document.getElementById('add-doc-form').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('doc-title').value;
            const url = document.getElementById('doc-url').value;

            try {
                await addDoc(collection(db, "resources"), {
                    title: title,
                    url: url,
                    createdAt: serverTimestamp()
                });
                e.target.reset();
                alert("Document ajouté avec succès !");
            } catch (err) {
                alert("Erreur lors de l'ajout : " + err.message);
            }
        };

        // CHARGER LES DOCUMENTS (CLIENT)
        function loadDocuments() {
            const q = query(collection(db, "resources"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                docGrid.innerHTML = '';
                if (snapshot.empty) {
                    docGrid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">Aucun document disponible pour le moment.</p>`;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = `
                        <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition border-l-4 border-brand-dark">
                            <h3 class="font-bold text-lg text-brand-dark mb-4">${data.title}</h3>
                            <a href="${data.url}" target="_blank" class="flex items-center text-vibrant-green font-bold hover:underline">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Télécharger le PDF
                            </a>
                        </div>
                    `;
                    docGrid.innerHTML += card;
                });
            });
        }
    </script>
</body>
</html>
