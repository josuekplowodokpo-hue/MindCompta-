<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Ressources & Bibliothèque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { --brand-dark: #1E3A8A; --accent: #F59E0B; font-family: 'Inter', sans-serif; }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        .nav-link { color: white; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: 0.2s; }
        .active-link { background-color: var(--accent); color: var(--brand-dark) !important; font-weight: 600; }
        .post-card { border-left: 6px solid var(--brand-dark); }
        .tab-btn.active { border-bottom: 4px solid var(--accent); color: var(--brand-dark); font-weight: 900; }
        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; z-index: 50; }
        #mobile-menu.open { transform: translateX(0); }
        #mobile-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        #mobile-menu-overlay.open { display: block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'" class="h-10 w-auto rounded-full mr-3 border-2 border-white transition group-hover:scale-105">
                <span class="text-xl font-bold tracking-wider">MindCompta</span>
            </a>
            <nav class="hidden md:flex items-center space-x-2">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="services.html" class="nav-link active-link">Services</a>
                <a href="about.html" class="nav-link">À Propos</a>
                <a href="youtube.html" class="nav-link">Vidéos YouTube</a>
                <div id="auth-actions-desktop" class="flex items-center ml-4 border-l border-blue-800 pl-4"></div>
            </nav>
            <button id="menu-button" class="md:hidden p-2"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        </div>
    </header>

    <div id="mobile-menu-overlay"></div>
    <nav id="mobile-menu" class="fixed top-0 right-0 w-64 h-full bg-brand-dark text-white shadow-2xl z-50 p-6 flex flex-col">
        <button id="close-menu-button" class="absolute top-4 right-4 text-4xl">&times;</button>
        <div class="pt-12 flex flex-col h-full space-y-4">
            <a href="index.html" class="block p-3">Accueil</a>
            <a href="services.html" class="block p-3 bg-accent text-brand-dark font-bold rounded">Services</a>
            <a href="about.html" class="block p-3">À Propos</a>
            <a href="youtube.html" class="block p-3">Vidéos YouTube</a>
            <hr class="border-gray-700">
            <div id="auth-actions-mobile"></div>
        </div>
    </nav>

    <main class="w-full max-w-6xl mx-auto p-4 flex-grow">
        <div class="flex justify-center space-x-8 border-b mb-8 mt-6">
            <button onclick="switchTab('articles')" id="btn-articles" class="tab-btn active pb-2 uppercase text-sm tracking-widest font-bold">Flux Articles</button>
            <button onclick="switchTab('library')" id="btn-library" class="tab-btn pb-2 uppercase text-sm tracking-widest font-bold text-gray-400">Bibliothèque</button>
        </div>

        <div id="section-articles" class="tab-content">
            <div id="admin-articles" class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-2 border-accent hidden">
                <h2 class="text-xl font-bold mb-4 text-brand-dark uppercase">Publier un Article</h2>
                <form id="form-article" class="space-y-3">
                    <input type="text" id="art-title" required class="w-full p-3 border rounded-lg" placeholder="Titre...">
                    <input type="url" id="art-img" class="w-full p-3 border rounded-lg" placeholder="Lien image...">
                    <textarea id="art-content" required class="w-full p-3 border rounded-lg" rows="4" placeholder="Contenu..."></textarea>
                    <button class="w-full bg-brand-dark text-white py-3 rounded-lg font-bold">PUBLIER</button>
                </form>
            </div>
            <div id="articles-list" class="grid gap-6"></div>
        </div>

        <div id="section-library" class="tab-content hidden">
            <div id="admin-library" class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-2 border-accent hidden">
                <h2 class="text-xl font-bold mb-4 text-brand-dark uppercase">Ajouter un Livre</h2>
                <form id="form-book" class="space-y-3">
                    <input type="text" id="book-title" required class="w-full p-3 border rounded-lg" placeholder="Titre du livre">
                    <input type="text" id="book-author" required class="w-full p-3 border rounded-lg" placeholder="Nom de l'auteur">
                    <input type="url" id="book-img" required class="w-full p-3 border rounded-lg" placeholder="Lien de la couverture (URL)">
                    <textarea id="book-desc" required class="w-full p-3 border rounded-lg" rows="3" placeholder="Petite description / résumé"></textarea>
                    <button class="w-full bg-accent text-brand-dark py-3 rounded-lg font-bold">AJOUTER À LA BIBLIOTHÈQUE</button>
                </form>
            </div>
            <div id="library-list" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </div>

        <div id="login-msg" class="hidden text-center py-20 bg-white rounded-3xl shadow">
            <p class="text-gray-500 font-bold mb-4">Veuillez vous connecter pour voir le contenu.</p>
            <a href="login.html" class="bg-brand-dark text-white px-8 py-2 rounded-full font-bold">CONNEXION</a>
        </div>
    </main>

    <footer class="w-full bg-brand-dark py-6 mt-auto text-center text-gray-400 text-xs">
        © 2025 MindCompta Finance - Tous droits réservés.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const fbConfig = { apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0", authDomain: "mindcompta-a61ef.firebaseapp.com", projectId: "mindcompta-a61ef", storageBucket: "mindcompta-a61ef.firebasestorage.app", messagingSenderId: "578389020450", appId: "1:578389020450:web:edf9dd48e394cff7601f7b" };
        const app = initializeApp(fbConfig); const auth = getAuth(app); const db = getFirestore(app);
        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";

        // Navigation Tabs
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'text-brand-dark'));
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).classList.add('active');
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const isAdmin = user.uid === ADMIN_UID;
                if(isAdmin) { document.getElementById('admin-articles').classList.remove('hidden'); document.getElementById('admin-library').classList.remove('hidden'); }
                loadArticles(isAdmin);
                loadLibrary(isAdmin);
                
                const logout = `<button onclick="signOut(auth)" class="bg-red-600 px-3 py-1 rounded text-white text-[10px] font-bold">DÉCONNEXION</button>`;
                document.getElementById('auth-actions-desktop').innerHTML = logout;
                document.getElementById('auth-actions-mobile').innerHTML = logout;
            } else {
                document.getElementById('login-msg').classList.remove('hidden');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            }
        });

        // Load Articles
        function loadArticles(isAdmin) {
            onSnapshot(query(collection(db, "resources"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('articles-list'); list.innerHTML = '';
                snap.forEach(ds => {
                    const data = ds.data();
                    list.innerHTML += `
                        <div class="bg-white p-6 rounded-xl shadow-sm post-card">
                            <h3 class="font-black text-xl text-brand-dark mb-2">${data.title}</h3>
                            <p class="text-gray-600 text-sm whitespace-pre-wrap">${data.content}</p>
                            ${isAdmin ? `<button onclick="deleteDoc(doc(db, 'resources', '${ds.id}'))" class="text-red-500 text-[10px] mt-4 uppercase font-bold">Supprimer</button>` : ''}
                        </div>`;
                });
            });
        }

        // Load Library (NEW)
        
        function loadLibrary(isAdmin) {
            onSnapshot(query(collection(db, "library"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('library-list'); list.innerHTML = '';
                snap.forEach(ds => {
                    const book = ds.data();
                    list.innerHTML += `
                        <div class="bg-white rounded-lg shadow hover:shadow-md transition overflow-hidden flex flex-col">
                            <img src="${book.imageUrl}" class="w-full h-48 object-cover" alt="book">
                            <div class="p-3 flex-grow">
                                <h4 class="font-bold text-brand-dark leading-tight mb-1">${book.title}</h4>
                                <p class="text-[10px] font-bold text-accent uppercase mb-2">Auteur: ${book.author}</p>
                                <p class="text-xs text-gray-500 line-clamp-3">${book.description}</p>
                            </div>
                            ${isAdmin ? `<button onclick="deleteDoc(doc(db, 'library', '${ds.id}'))" class="bg-red-50 text-red-500 text-[10px] py-1 font-bold">Supprimer</button>` : ''}
                        </div>`;
                });
            });
        }

        // Add Book
        document.getElementById('form-book').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "library"), {
                title: document.getElementById('book-title').value,
                author: document.getElementById('book-author').value,
                imageUrl: document.getElementById('book-img').value,
                description: document.getElementById('book-desc').value,
                createdAt: serverTimestamp()
            });
            e.target.reset();
            alert("Livre ajouté !");
        };

        // Add Article
        document.getElementById('form-article').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "resources"), {
                title: document.getElementById('art-title').value,
                content: document.getElementById('art-content').value,
                imageUrl: document.getElementById('art-img').value || null,
                createdAt: serverTimestamp()
            });
            e.target.reset();
        };

        // Menu Logic
        const toggle = () => { document.getElementById('mobile-menu').classList.toggle('open'); document.getElementById('mobile-menu-overlay').classList.toggle('open'); };
        document.getElementById('menu-button').onclick = toggle;
        document.getElementById('close-menu-button').onclick = toggle;
        document.getElementById('mobile-menu-overlay').onclick = toggle;
        window.signOut = (a) => signOut(a).then(() => window.location.reload());
    </script>
</body>
</html>
