<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Ressources & Documents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            --vibrant-green: #10B981;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        .hover-accent:hover { background-color: #D97706; }
        
        .nav-link { color: white; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: 0.2s; }
        .nav-link:hover { background-color: #345b85; }
        .active-link { background-color: var(--accent); color: var(--brand-dark) !important; font-weight: 600; }

        /* Menu Mobile Fix */
        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; z-index: 50; }
        #mobile-menu.open { transform: translateX(0); }
        #mobile-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        #mobile-menu-overlay.open { display: block; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'" class="h-10 w-auto rounded-full mr-3 border-2 border-white transition group-hover:scale-105">
                <span class="text-xl font-bold tracking-wider group-hover:text-accent">MindCompta</span>
            </a>
            
            <nav class="hidden sm:flex items-center space-x-4">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="services.html" class="nav-link active-link">Services</a>
                <a href="about.html" class="nav-link">À Propos</a>
                <div id="auth-actions-desktop" class="flex items-center space-x-3 ml-4"></div>
            </nav>

            <button id="menu-button" class="sm:hidden p-2 text-white">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
    </header>

    <div id="mobile-menu-overlay"></div>
    <nav id="mobile-menu" class="fixed top-0 right-0 w-64 h-full bg-brand-dark p-6 shadow-2xl">
        <button id="close-menu" class="text-white text-3xl mb-8">&times;</button>
        <div class="flex flex-col space-y-4 text-white">
            <a href="index.html" class="p-2 hover:bg-blue-800 rounded">Accueil</a>
            <a href="services.html" class="p-2 bg-accent text-brand-dark rounded font-bold">Services</a>
            <a href="about.html" class="p-2 hover:bg-blue-800 rounded">À Propos</a>
            <hr class="border-gray-600">
            <div id="auth-actions-mobile" class="flex flex-col space-y-2"></div>
        </div>
    </nav>

    <main class="w-full max-w-4xl mx-auto p-4 flex-grow">
        <h1 class="text-3xl font-extrabold text-brand-dark mb-8 mt-4">Services & Documents</h1>

        <div id="admin-section" class="bg-white p-6 rounded-xl shadow-lg mb-10 border-t-4 border-accent hidden">
            <h2 class="text-xl font-bold text-brand-dark mb-4 uppercase text-sm tracking-widest">Nouveau Document (Saisie Admin)</h2>
            <form id="add-doc-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">TITRE DU DOCUMENT</label>
                    <input type="text" id="doc-title" required class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-accent outline-none transition" placeholder="Ex: Rapport mensuel Décembre 2024">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">CONTENU / TEXTE DU DOCUMENT</label>
                    <textarea id="doc-content" required rows="6" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-accent outline-none transition" placeholder="Saisissez ici le texte que les clients pourront lire..."></textarea>
                </div>
                <button type="submit" class="w-full bg-brand-dark text-white font-black py-4 rounded-lg shadow-xl hover:bg-blue-900 transition transform hover:scale-[1.01] flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    PUBLIER MAINTENANT
                </button>
            </form>
        </div>

        <div id="login-required" class="hidden text-center py-20 bg-white rounded-xl shadow">
            <p class="text-gray-500 mb-4">Veuillez vous connecter pour voir les documents.</p>
            <a href="login.html" class="bg-accent px-6 py-2 rounded-full font-bold">Se connecter</a>
        </div>

        <div id="documents-list" class="space-y-6 hidden">
            </div>

        <div id="loader" class="text-center py-10 text-gray-400 animate-pulse">Initialisation...</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0",
            authDomain: "mindcompta-a61ef.firebaseapp.com",
            projectId: "mindcompta-a61ef",
            storageBucket: "mindcompta-a61ef.firebasestorage.app",
            messagingSenderId: "578389020450",
            appId: "1:578389020450:web:edf9dd48e394cff7601f7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            document.getElementById('loader').classList.add('hidden');
            if (user) {
                document.getElementById('documents-list').classList.remove('hidden');
                document.getElementById('auth-actions-desktop').innerHTML = `<button id="logout-btn" class="bg-red-500 px-4 py-2 rounded-full text-xs font-bold">Déconnexion</button>`;
                document.getElementById('logout-btn').onclick = () => signOut(auth);
                
                if (user.uid === ADMIN_UID) document.getElementById('admin-section').classList.remove('hidden');
                loadDocs();
            } else {
                document.getElementById('login-required').classList.remove('hidden');
            }
        });

        // Add Doc Logic
        document.getElementById('add-doc-form').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('doc-title').value;
            const content = document.getElementById('doc-content').value;
            
            try {
                await addDoc(collection(db, "resources"), {
                    title,
                    content,
                    author: auth.currentUser.email,
                    createdAt: serverTimestamp()
                });
                e.target.reset();
                alert("Publié !");
            } catch (err) { alert("Erreur: " + err.message); }
        };

        // Load Docs Logic
        function loadDocs() {
            const q = query(collection(db, "resources"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('documents-list');
                list.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    list.innerHTML += `
                        <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-brand-dark">
                            <h3 class="text-xl font-bold text-brand-dark mb-2">${d.title}</h3>
                            <p class="text-gray-600 whitespace-pre-wrap leading-relaxed">${d.content}</p>
                            <div class="mt-4 text-[10px] text-gray-400 uppercase tracking-tighter">Publié le ${d.createdAt?.toDate().toLocaleDateString() || '...'}</div>
                        </div>
                    `;
                });
            });
        }

        // Menu Toggle Logic
        const menuBtn = document.getElementById('menu-button');
        const closeBtn = document.getElementById('close-menu');
        const menu = document.getElementById('mobile-menu');
        const overlay = document.getElementById('mobile-menu-overlay');

        const toggle = () => { menu.classList.toggle('open'); overlay.classList.toggle('open'); };
        menuBtn.onclick = toggle;
        closeBtn.onclick = toggle;
        overlay.onclick = toggle;
    </script>
</body>
</html>
