<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Services & Flux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --brand-dark: #1E3A8A;
            --accent: #F59E0B;
            --vibrant-green: #10B981;
            font-family: 'Inter', sans-serif;
        }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        
        .nav-link { color: white; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: 0.2s; }
        .nav-link:hover { background-color: #345b85; }
        .active-link { background-color: var(--accent); color: var(--brand-dark) !important; font-weight: 600; }

        /* Animation Menu Mobile */
        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; z-index: 50; }
        #mobile-menu.open { transform: translateX(0); }
        #mobile-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        #mobile-menu-overlay.open { display: block; }

        .post-card { transition: all 0.3s ease; border-left: 6px solid var(--brand-dark); }
        .post-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'" class="h-10 w-auto rounded-full mr-3 border-2 border-white transition group-hover:scale-105">
                <span class="text-xl font-bold tracking-wider group-hover:text-accent">MindCompta</span>
            </a>
            
            <nav class="hidden sm:flex items-center space-x-2">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="services.html" class="nav-link active-link">Services</a>
                <a href="about.html" class="nav-link">À Propos</a>
                <a href="youtube.html" class="nav-link">Vidéos YouTube</a>
                <div id="auth-actions-desktop" class="flex items-center space-x-3 ml-4"></div>
            </nav>

            <button id="menu-button" class="sm:hidden p-2 text-white">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
    </header>

    <div id="mobile-menu-overlay"></div>
    <nav id="mobile-menu" class="fixed top-0 right-0 w-72 h-full bg-brand-dark p-6 shadow-2xl">
        <button id="close-menu" class="text-white text-4xl mb-8">&times;</button>
        <div class="flex flex-col space-y-3 text-white">
            <a href="index.html" class="p-3 hover:bg-blue-800 rounded-lg">Accueil</a>
            <a href="services.html" class="p-3 bg-accent text-brand-dark rounded-lg font-bold">Services</a>
            <a href="about.html" class="p-3 hover:bg-blue-800 rounded-lg">À Propos</a>
            <a href="youtube.html" class="p-3 hover:bg-blue-800 rounded-lg">Vidéos YouTube</a>
            <hr class="border-gray-700 my-4">
            <div id="auth-actions-mobile" class="flex flex-col space-y-3"></div>
        </div>
    </nav>

    <main class="w-full max-w-5xl mx-auto p-4 flex-grow">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 mt-6">
            <h1 class="text-4xl font-black text-brand-dark italic uppercase tracking-tight">Espace <span class="text-accent">Ressources</span></h1>
            <p id="user-welcome" class="text-gray-500 font-medium"></p>
        </div>

        <div id="admin-section" class="bg-white p-8 rounded-2xl shadow-xl mb-12 border-2 border-accent hidden">
            <h2 class="text-2xl font-bold text-brand-dark mb-6">Nouvelle Publication</h2>
            <form id="add-doc-form" class="space-y-4">
                <input type="text" id="doc-title" required class="w-full bg-gray-50 border-2 border-gray-200 p-4 rounded-xl outline-none focus:border-brand-dark font-semibold" placeholder="Titre du document...">
                <input type="url" id="doc-image" class="w-full bg-gray-50 border-2 border-gray-200 p-4 rounded-xl outline-none focus:border-brand-dark" placeholder="Lien URL d'une image trouvée en ligne (Optionnel)">
                <textarea id="doc-content" required rows="6" class="w-full bg-gray-50 border-2 border-gray-200 p-4 rounded-xl outline-none focus:border-brand-dark" placeholder="Saisissez votre texte ici..."></textarea>
                <button type="submit" class="w-full bg-brand-dark text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-900 transition">PUBLIER MAINTENANT</button>
            </form>
        </div>

        <div id="login-required" class="hidden text-center py-20 bg-white rounded-3xl shadow">
            <h3 class="text-xl font-bold mb-4">Accès réservé aux membres</h3>
            <a href="login.html" class="bg-brand-dark text-white px-8 py-3 rounded-full font-bold">Se connecter</a>
        </div>

        <div id="documents-list" class="grid grid-cols-1 gap-8 hidden"></div>

        <div id="loader" class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-accent"></div>
        </div>
    </main>

    <footer class="w-full bg-brand-dark border-t border-gray-700 py-8 mt-auto text-center text-gray-400">
        © 2025 MindCompta - Tous droits réservés.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0",
            authDomain: "mindcompta-a61ef.firebaseapp.com",
            projectId: "mindcompta-a61ef",
            storageBucket: "mindcompta-a61ef.firebasestorage.app",
            messagingSenderId: "578389020450",
            appId: "1:578389020450:web:edf9dd48e394cff7601f7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";

        // Suppression globale
        window.deletePublication = async (id) => {
            if(confirm("Supprimer définitivement ?")) {
                try { await deleteDoc(doc(db, "resources", id)); } catch(e) { alert("Erreur"); }
            }
        };

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loader').classList.add('hidden');
            const dAuth = document.getElementById('auth-actions-desktop');
            const mAuth = document.getElementById('auth-actions-mobile');
            
            if (user) {
                document.getElementById('documents-list').classList.remove('hidden');
                document.getElementById('user-welcome').innerText = `Bonjour, ${user.email.split('@')[0]}`;
                
                const isAdmin = user.uid === ADMIN_UID;
                const adminBtn = isAdmin ? `<a href="admin.html" class="bg-red-600 px-4 py-2 rounded-lg text-xs font-bold">CONSOLE ADMIN</a>` : '';
                
                dAuth.innerHTML = `${adminBtn} <button id="logout-btn" class="bg-gray-700 px-4 py-2 rounded-lg text-xs font-bold">DÉCONNEXION</button>`;
                mAuth.innerHTML = `${isAdmin ? '<a href="admin.html" class="p-3 bg-red-600 rounded-lg text-center font-bold">CONSOLE ADMIN</a>' : ''} <button id="logout-btn-mob" class="p-3 bg-gray-700 rounded-lg font-bold">DÉCONNEXION</button>`;

                const logoff = () => signOut(auth);
                document.getElementById('logout-btn').onclick = logoff;
                document.getElementById('logout-btn-mob').onclick = logoff;
                
                if (isAdmin) document.getElementById('admin-section').classList.remove('hidden');
                loadDocs(isAdmin);
            } else {
                document.getElementById('login-required').classList.remove('hidden');
                const logBtn = `<a href="login.html" class="bg-accent px-6 py-2 rounded-full text-brand-dark font-bold">CONNEXION</a>`;
                dAuth.innerHTML = logBtn; mAuth.innerHTML = logBtn;
            }
        });

        function loadDocs(isAdmin) {
            const q = query(collection(db, "resources"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('documents-list');
                list.innerHTML = '';
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const date = data.createdAt ? data.createdAt.toDate().toLocaleDateString('fr-FR') : 'Récemment';
                    const img = data.imageUrl ? `<img src="${data.imageUrl}" class="w-full h-64 object-cover rounded-xl mb-4 shadow-sm" onerror="this.style.display='none'">` : '';
                    
                    list.innerHTML += `
                        <article class="post-card bg-white p-6 md:p-8 rounded-2xl shadow-sm relative">
                            <div class="flex justify-between items-center mb-4">
                                <span class="bg-blue-50 text-brand-dark text-[10px] font-bold px-3 py-1 rounded-full uppercase border border-blue-100">${date}</span>
                                ${isAdmin ? `<button onclick="deletePublication('${docSnap.id}')" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded">Supprimer</button>` : ''}
                            </div>
                            ${img}
                            <h3 class="text-2xl font-black text-brand-dark mb-4">${data.title}</h3>
                            <div class="text-gray-600 whitespace-pre-wrap leading-relaxed">${data.content}</div>
                            <div class="mt-6 pt-6 border-t border-gray-100 flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-brand-dark flex items-center justify-center text-[10px] font-bold text-white">MC</div>
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">MindCompta Finance</span>
                            </div>
                        </article>`;
                });
            });
        }

        document.getElementById('add-doc-form').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('doc-title').value;
            const content = document.getElementById('doc-content').value;
            const imageUrl = document.getElementById('doc-image').value;
            try {
                await addDoc(collection(db, "resources"), { title, content, imageUrl: imageUrl || null, createdAt: serverTimestamp() });
                e.target.reset();
            } catch (err) { alert(err.message); }
        };

        const menuBtn = document.getElementById('menu-button');
        const closeBtn = document.getElementById('close-menu');
        const menu = document.getElementById('mobile-menu');
        const overlay = document.getElementById('mobile-menu-overlay');
        const toggle = () => { menu.classList.toggle('open'); overlay.classList.toggle('open'); };
        menuBtn.onclick = toggle; closeBtn.onclick = toggle; overlay.onclick = toggle;
    </script>
</body>
</html>
