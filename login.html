<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LIAISON VERS LE FICHIER CSS EXTERNE PARTAGÉ -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- EN-TÊTE ET NAVIGATION (Simple pour l'auth) -->
    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <img src="logo.jpg" 
                         alt="MindCompta Logo" 
                         class="h-10 w-auto rounded-full mr-3 border-2 border-white">
                    <span class="text-xl font-bold tracking-wider">MindCompta Finance</span>
                </div>
                <nav class="hidden sm:flex items-center space-x-6">
                    <a href="index.html" class="nav-link">Accueil</a>
                    <a href="register.html" class="bg-accent py-2 px-5 text-sm font-semibold rounded-full shadow-lg hover-accent transition duration-300 text-white">
                        Créer un Compte
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL : FORMULAIRE DE CONNEXION -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border-t-4 border-brand-dark">
            <h1 class="text-3xl font-bold text-center text-brand-dark mb-2">Connectez-vous</h1>
            <p class="text-center text-gray-500 mb-8">Accédez à vos outils financiers.</p>

            <!-- Message d'Authentification (Succès/Erreur) -->
            <div id="auth-message" class="hidden p-3 mb-4 rounded-lg border text-center text-sm font-medium">
                <!-- Les classes de couleur et de bordure sont ajoutées par JS -->
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <!-- Champ Email -->
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adresse Email</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent transition duration-200" 
                           placeholder="votre.email@exemple.com">
                </div>

                <!-- Champ Mot de Passe -->
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de Passe</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent transition duration-200" 
                           placeholder="Mot de passe">
                    <p class="mt-1 text-xs text-gray-400">Mot de passe oublié?</p>
                </div>

                <!-- Bouton de Connexion -->
                <button type="submit" 
                        class="w-full bg-brand-dark text-white font-semibold py-3 rounded-lg shadow-lg hover:bg-opacity-90 transition duration-300 transform hover:scale-[1.005]">
                    Se Connecter
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">
                Pas encore de compte ? 
                <a href="register.html" class="text-accent hover:underline font-medium">Créez-en un ici</a>.
            </p>
        </div>
    </main>

    <!-- PIED DE PAGE -->
    <footer class="w-full bg-brand-dark py-4 mt-auto">
        <p class="text-center text-sm text-gray-400">&copy; 2025 MindCompta. Tous droits réservés.</p>
    </footer>

    <!-- LOGIQUE JAVASCRIPT (Doit être chargé comme module pour Firebase) -->
    <script type="module" src="script.js"></script>
</body>
</html>
