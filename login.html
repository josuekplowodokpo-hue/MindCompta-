<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Authentification</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7972578599056246"
     crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { --brand-dark: #1E3A8A; --accent: #F59E0B; font-family: 'Inter', sans-serif; }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'" 
                     class="h-10 w-10 rounded-full mr-3 border-2 border-white object-cover">
                <span class="text-xl font-bold tracking-wider">MindCompta Finance</span>
            </a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div id="auth-container" class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8 border border-gray-100"> 
            <h2 id="form-title" class="text-3xl font-bold text-brand-dark mb-6 text-center">Connexion</h2>

            <!-- Bouton Google -->
            <button id="google-btn" type="button" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 py-3 rounded-lg mb-6 hover:bg-gray-50 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#fbc02d" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    <path fill="#e53935" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                    <path fill="#4caf50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                    <path fill="#1565c0" d="M43.611,20.083L43.595,20L42,20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                </svg>
                <span class="text-gray-700 font-semibold">Continuer avec Google</span>
            </button>

            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">Ou</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <form id="auth-form" class="space-y-4 text-left">
                <!-- Champs Nom et Prénom (Affichés uniquement en mode Inscription) -->
                <div id="register-fields" class="hidden grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Prénom</label>
                        <input type="text" id="auth-firstname" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none" placeholder="Jean">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nom</label>
                        <input type="text" id="auth-lastname" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none" placeholder="Dupont">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Adresse Email</label>
                    <input type="email" id="auth-email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none" placeholder="votre@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mot de Passe</label>
                    <input type="password" id="auth-password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none" placeholder="••••••••">
                </div>

                <div id="forgot-pw-container" class="text-right">
                    <button id="forgot-password" type="button" class="text-xs text-brand-dark hover:underline font-medium">Mot de passe oublié ?</button>
                </div>

                <div id="auth-message" class="text-center p-3 rounded-lg text-sm hidden border-l-4 mt-4"></div>

                <button type="submit" id="auth-button" class="w-full bg-brand-dark text-white font-semibold py-3 rounded-lg shadow-md hover:opacity-90 transition mt-2 uppercase tracking-wider">
                    Se Connecter
                </button>
            </form>

            <div class="mt-6 text-center text-sm">
                <p class="text-gray-600">
                    <span id="switch-text">Pas encore de compte ?</span>
                    <button id="switch-button" type="button" class="text-brand-dark font-semibold hover:underline ml-1">Créer un compte</button>
                </p>
            </div>
        </div>
    </main>

    <!-- Modal de finalisation de profil pour les nouveaux utilisateurs Google -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-full shadow-2xl">
            <h2 class="text-xl font-bold text-brand-dark mb-4 uppercase text-center">Finalisez votre profil</h2>
            <p class="text-gray-600 text-sm mb-4 text-center">Veuillez entrer votre nom et prénom pour continuer.</p>
            <div class="space-y-4">
                <input type="text" id="modal-firstname" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none" placeholder="Prénom">
                <input type="text" id="modal-lastname" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none" placeholder="Nom">
                <button id="save-profile-btn" class="w-full bg-accent text-white font-bold py-3 rounded-xl uppercase">Valider mon profil</button>
            </div>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
        getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
        GoogleAuthProvider, signInWithPopup, setPersistence, browserSessionPersistence,
        sendPasswordResetEmail, sendEmailVerification, signOut, updateProfile
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0", 
        authDomain: "mindcompta-a61ef.firebaseapp.com", 
        projectId: "mindcompta-a61ef", 
        storageBucket: "mindcompta-a61ef.firebasestorage.app", 
        messagingSenderId: "578389020450", 
        appId: "1:578389020450:web:edf9dd48e394cff7601f7b" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_UID = "2BEpfRKWXIVGxyS7wJM8iSmvWY92";
    let isSignInMode = true;
    let pendingGoogleUser = null;

    const formTitle = document.getElementById('form-title');
    const authButton = document.getElementById('auth-button');
    const switchButton = document.getElementById('switch-button');
    const switchText = document.getElementById('switch-text');
    const authMessage = document.getElementById('auth-message');
    const registerFields = document.getElementById('register-fields');
    const forgotPwContainer = document.getElementById('forgot-pw-container');

    function showMsg(text, isSuccess) {
        authMessage.innerText = text;
        authMessage.className = `text-center p-3 rounded-lg text-sm border-l-4 mt-4 ${isSuccess ? 'bg-green-100 text-green-700 border-green-500' : 'bg-red-100 text-red-700 border-red-500'}`;
        authMessage.classList.remove('hidden');
    }

    // SWITCH CONNEXION / INSCRIPTION
    switchButton.onclick = (e) => {
        e.preventDefault();
        isSignInMode = !isSignInMode;
        formTitle.innerText = isSignInMode ? "Connexion" : "Inscription";
        authButton.innerText = isSignInMode ? "Se Connecter" : "S'inscrire";
        switchText.innerText = isSignInMode ? "Pas encore de compte ?" : "Déjà un compte ?";
        switchButton.innerText = isSignInMode ? "Créer un compte" : "Se connecter";
        isSignInMode ? registerFields.classList.add('hidden') : registerFields.classList.remove('hidden');
        isSignInMode ? forgotPwContainer.classList.remove('hidden') : forgotPwContainer.classList.add('hidden');
        authMessage.classList.add('hidden');
    };

    // --- NOUVEAU : GESTION DU MOT DE PASSE OUBLIÉ ---
    document.getElementById('forgot-password').onclick = async () => {
        const email = document.getElementById('auth-email').value.trim();
        if (!email) {
            return showMsg("Veuillez saisir votre email dans le champ ci-dessus pour recevoir le lien de réinitialisation.", false);
        }
        try {
            await sendPasswordResetEmail(auth, email);
            showMsg("Lien de réinitialisation envoyé par email !", true);
        } catch (err) {
            console.error(err);
            let message = "Erreur lors de l'envoi.";
            if (err.code === 'auth/user-not-found') message = "Aucun utilisateur trouvé avec cet email.";
            showMsg(message, false);
        }
    };

    // GESTION GOOGLE
    document.getElementById('google-btn').onclick = async () => {
        const provider = new GoogleAuthProvider();
        try {
            await setPersistence(auth, browserSessionPersistence);
            const res = await signInWithPopup(auth, provider);
            const user = res.user;

            // On vérifie dans la collection 'users' (pour correspondre à la suppression de compte)
            const userDoc = await getDoc(doc(db, "users", user.uid));

            if (!userDoc.exists()) {
                pendingGoogleUser = user;
                document.getElementById('profile-modal').classList.remove('hidden');
            } else {
                window.location.href = 'index.html';
            }
        } catch (err) { showMsg(err.message, false); }
    };

    // SAUVEGARDE PROFIL MODAL (GOOGLE)
    document.getElementById('save-profile-btn').onclick = async () => {
        const fn = document.getElementById('modal-firstname').value.trim();
        const ln = document.getElementById('modal-lastname').value.trim();
        if (!fn || !ln || !pendingGoogleUser) return showMsg("Veuillez remplir les deux champs.", false);

        try {
            const fullName = `${fn} ${ln}`;
            await updateProfile(pendingGoogleUser, { displayName: fullName });
            // Stockage dans 'users'
            await setDoc(doc(db, "users", pendingGoogleUser.uid), {
                uid: pendingGoogleUser.uid,
                email: pendingGoogleUser.email,
                firstName: fn,
                lastName: ln,
                displayName: fullName,
                role: "Client",
                createdAt: serverTimestamp(),
                status: "EN LIGNE"
            });
            window.location.href = 'index.html';
        } catch (err) { showMsg(err.message, false); }
    };

    // FORMULAIRE PRINCIPAL (EMAIL/PASSWORD)
    document.getElementById('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const firstName = document.getElementById('auth-firstname').value?.trim();
        const lastName = document.getElementById('auth-lastname').value?.trim();

        if (!isSignInMode && (!firstName || !lastName)) {
            return showMsg("Prénom et Nom sont requis.", false);
        }

        authButton.disabled = true;
        authButton.innerText = "Traitement...";

        try {
            await setPersistence(auth, browserSessionPersistence);
            if (isSignInMode) {
                const res = await signInWithEmailAndPassword(auth, email, password);
                if (!res.user.emailVerified && res.user.uid !== ADMIN_UID) {
                    await signOut(auth);
                    showMsg("Veuillez vérifier votre email avant de vous connecter.", false);
                    authButton.disabled = false; return;
                }
                window.location.href = 'index.html';
            } else {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                const fullName = `${firstName} ${lastName}`;
                await updateProfile(res.user, { displayName: fullName });
                await sendEmailVerification(res.user);
                
                // Stockage dans 'users' pour être cohérent partout
                await setDoc(doc(db, "users", res.user.uid), {
                    uid: res.user.uid,
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    displayName: fullName,
                    role: "Client",
                    createdAt: serverTimestamp(),
                    status: "HORS LIGNE"
                });
                
                await signOut(auth);
                showMsg("Compte créé ! Vérifiez vos emails pour valider votre compte.", true);
                authButton.disabled = false;
                isSignInMode = true;
                // Simule un retour au mode connexion
                switchButton.click(); 
            }
        } catch (err) { 
            let errorMsg = err.message;
            if (err.code === 'auth/wrong-password') errorMsg = "Mot de passe incorrect.";
            if (err.code === 'auth/user-not-found') errorMsg = "Aucun compte trouvé avec cet email.";
            showMsg("Erreur: " + errorMsg, false);
            authButton.disabled = false;
        }
    };
</script>
</body>
</html>
