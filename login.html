<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Authentification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { --brand-dark: #1E3A8A; --accent: #F59E0B; font-family: 'Inter', sans-serif; }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <div class="h-10 w-10 bg-white rounded-full mr-3 flex items-center justify-center text-brand-dark font-bold">MC</div>
                <span class="text-xl font-bold tracking-wider">MindCompta Finance</span>
            </a>
            <nav class="hidden sm:flex items-center space-x-4">
                <a href="index.html" class="hover:text-accent transition">Accueil</a>
                <a href="login.html" class="bg-accent py-2 px-5 text-sm font-semibold rounded-full text-brand-dark">Se Connecter</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-xl shadow-2xl p-8"> 
            <h2 id="form-title" class="text-3xl font-bold text-brand-dark mb-6 text-center">Connexion</h2>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Adresse Email</label>
                    <input type="email" id="auth-email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mot de Passe</label>
                    <input type="password" id="auth-password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none">
                    <p id="password-hint" class="text-xs text-gray-500 mt-1 hidden">Minimum 6 caractères.</p>
                </div>

                <div id="auth-message" class="text-center p-3 rounded-lg text-sm hidden border-l-4 mt-4"></div>

                <button type="submit" id="auth-button" class="w-full bg-accent text-white font-semibold py-3 rounded-lg shadow-md hover:opacity-90 transition mt-6">
                    Se Connecter
                </button>
            </form>

            <div class="mt-6 text-center text-sm">
                <p id="switch-container" class="text-gray-600">
                    Pas encore de compte ? 
                    <button id="switch-button" class="text-brand-dark font-semibold hover:underline">Créer un compte</button>
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            setPersistence, 
            browserSessionPersistence 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0",
            authDomain: "mindcompta-a61ef.firebaseapp.com",
            projectId: "mindcompta-a61ef",
            storageBucket: "mindcompta-a61ef.firebasestorage.app",
            messagingSenderId: "578389020450",
            appId: "1:578389020450:web:edf9dd48e394cff7601f7b",
            measurementId: "G-CDS9XYT35Y"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignInMode = true;
        const authForm = document.getElementById('auth-form');
        const authButton = document.getElementById('auth-button');
        const authMessage = document.getElementById('auth-message');
        const switchBtn = document.getElementById('switch-button');

        function showMsg(msg, success) {
            authMessage.textContent = msg;
            authMessage.className = `text-center p-3 rounded-lg text-sm border-l-4 mt-4 ${success ? 'bg-green-100 text-green-700 border-green-500' : 'bg-red-100 text-red-700 border-red-500'}`;
            authMessage.classList.remove('hidden');
        }

        // Action de switch (simplifiée)
        document.body.addEventListener('click', (e) => {
            if(e.target && e.target.id === 'switch-button'){
                e.preventDefault();
                isSignInMode = !isSignInMode;
                document.getElementById('form-title').textContent = isSignInMode ? "Connexion" : "Création de Compte";
                authButton.textContent = isSignInMode ? "Se Connecter" : "S'inscrire";
                document.getElementById('switch-container').innerHTML = isSignInMode ? 
                    `Pas encore de compte ? <button id="switch-button" class="text-brand-dark font-semibold hover:underline">Créer un compte</button>` :
                    `Déjà un compte ? <button id="switch-button" class="text-brand-dark font-semibold hover:underline">Se connecter</button>`;
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            authButton.disabled = true;
            authButton.textContent = "Vérification...";

            try {
                // MODIFICATION ICI : On définit la persistance AVANT de connecter l'utilisateur
                await setPersistence(auth, browserSessionPersistence);

                if (isSignInMode) {
                    const res = await signInWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "artifacts", res.user.uid), { 
                        status: "EN LIGNE", 
                        lastLogin: serverTimestamp() 
                    }, { merge: true });
                    showMsg("Connexion réussie ! Redirection...", true);
                } else {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "artifacts", res.user.uid), {
                        uid: res.user.uid,
                        email: email,
                        displayName: email.split('@')[0],
                        role: "Client",
                        status: "EN LIGNE",
                        createdAt: serverTimestamp(),
                        lastLogin: serverTimestamp()
                    });
                    showMsg("Compte créé avec succès !", true);
                }
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (err) {
                showMsg("Erreur : " + err.message, false);
                authButton.disabled = false;
                authButton.textContent = isSignInMode ? "Se Connecter" : "S'inscrire";
            }
        });
    </script>
</body>
</html>
