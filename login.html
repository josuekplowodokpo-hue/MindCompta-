<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Connexion & Inscription</title>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Import the Inter font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        /* Brand Colors (Standardized) */
        :root {
            --brand-dark: #1E3A8A; /* Deep Blue (Indigo-900) */
            --accent: #F59E0B; /* Vivid Orange / Gold (Amber-500) */
            --vibrant-green: #10B981; /* Bright Green (Emerald-500) */
            font-family: 'Inter', sans-serif;
        }

        /* Custom Tailwind classes for colors */
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
        .hover-accent:hover { background-color: #D97706; } 

        /* Navigation Link Styles - Desktop */
        .nav-link {
            color: white;
            font-weight: 500;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .nav-link:hover {
            background-color: #345b85;
        }
        .active-link-desktop {
            background-color: var(--accent);
            font-weight: 600;
            color: var(--brand-dark) !important;
        }

        /* Mobile Menu Styles (Off-Canvas) */
        #mobile-menu {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 50; 
        }
        #mobile-menu.open {
            transform: translateX(0);
        }
        /* Overlay */
        #mobile-menu-overlay {
            display: none; 
            z-index: 40;
        }
        #mobile-menu-overlay.open {
            display: block;
        }
        .mobile-link {
            display: block;
            padding: 0.75rem 1rem;
            color: white;
            font-weight: 500;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .mobile-link.active-link-mobile {
            background-color: var(--accent);
            color: var(--brand-dark);
            font-weight: 700;
        }
        .mobile-link-btn {
             display: block;
             width: 100%;
             text-align: center;
        }

        /* Custom style for the Signup section background */
        .bg-brand-light {
            background-color: #4A63A5; /* Lighter shade of brand dark */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER AND NAVIGATION -->
    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center">

                <!-- LOGO/BRAND (CLICKABLE) -->
                <a href="index.html" class="flex items-center group">
                    <img src="logo.jpg" 
                         alt="[Image du Logo MindCompta]" 
                         onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'"
                         class="h-10 w-auto rounded-full mr-3 border-2 border-white group-hover:scale-105 transition">
                    <span class="text-xl font-bold tracking-wider group-hover:text-accent transition">MindCompta Finance</span>
                </a>

                <!-- NAVIGATION DESKTOP -->
                <nav id="desktop-nav" class="hidden sm:flex items-center space-x-4">
                    <a href="index.html" class="nav-link">Accueil</a>
                    <!-- Les liens de navigation Services, À Propos, etc. sont laissés pour la structure future -->
                    <a href="services.html" class="nav-link">Services (Livre)</a>
                    <a href="about.html" class="nav-link">À Propos</a>
                    <a href="youtube.html" class="nav-link">Vidéos YouTube</a>
                    
                    <!-- Ici, on est sur la page de connexion, donc pas de déconnexion/admin affiché -->
                    <a href="login_firebase.html" id="nav-login-btn" class="bg-accent py-2 px-5 text-sm font-semibold rounded-full shadow-lg hover-accent transition duration-300 active-link-desktop text-brand-dark">Se Connecter</a>
                </nav>

                <!-- BOUTON MENU MOBILE -->
                <button id="menu-button" class="sm:hidden p-2 rounded-lg hover:bg-[#345b85] transition duration-300" aria-label="Menu">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- MENU MOBILE OFF-CANVAS -->
    <div id="mobile-menu-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40"></div>
    <nav id="mobile-menu" class="fixed top-0 right-0 w-64 max-w-xs h-full bg-brand-dark text-white shadow-2xl z-50 p-6">
        <button id="close-menu-button" class="absolute top-4 right-4 text-4xl font-light hover:text-accent focus:outline-none">
            &times;
        </button>
        <div class="pt-12 space-y-3">
            <h3 class="text-xl font-bold border-b border-gray-700 pb-2 mb-4 text-accent">Navigation</h3>

            <a href="index.html" class="mobile-link">Accueil</a>
            <a href="services.html" class="mobile-link">Services (Livre)</a>
            <a href="about.html" class="mobile-link">À Propos</a>
            <a href="youtube.html" class="mobile-link">Vidéos YouTube</a>

            <div class="pt-6 border-t border-gray-700 mt-6 space-y-3">
                <a href="login_firebase.html" id="mobile-login-btn" class="mobile-link bg-accent mobile-link-btn active-link-mobile text-brand-dark">Se Connecter</a>
            </div>
        </div>
    </nav>
    <!-- FIN MENU MOBILE -->

    <!-- CONTENU PRINCIPAL (FORMULAIRES) -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden md:max-w-xl">
            <div id="form-container" class="md:flex">
                <!-- Section Connexion -->
                <div id="login-section" class="w-full md:w-1/2 p-8 transition-all duration-500">
                    <h2 class="text-3xl font-bold text-brand-dark mb-6 text-center">Connexion</h2>

                    <form id="login-form" class="space-y-4">
                        <div>
                            <label for="login-email" class="block text-sm font-medium text-gray-700">Adresse Email</label>
                            <input type="email" id="login-email" name="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-accent focus:border-accent">
                        </div>
                        <div>
                            <label for="login-password" class="block text-sm font-medium text-gray-700">Mot de Passe</label>
                            <input type="password" id="login-password" name="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Message d'erreur/succès -->
                        <div id="login-message" class="text-center p-3 rounded-lg text-sm hidden border-l-4 mt-4" role="alert"></div>

                        <button type="submit" id="login-button" class="w-full bg-accent text-white font-semibold py-3 rounded-lg shadow-md hover-accent transition duration-300 transform hover:scale-[1.01] mt-6">
                            Se Connecter
                        </button>
                    </form>

                    <div class="mt-6 text-center">
                        <p class="text-sm text-gray-600">
                            Pas encore de compte ? 
                            <button id="show-signup-btn-desktop" class="text-accent font-semibold hover:underline transition duration-300">
                                Créez-en un.
                            </button>
                        </p>
                    </div>
                </div>

                <!-- Section Inscription -->
                <div id="signup-section" class="w-full md:w-1/2 p-8 bg-brand-light transition-all duration-500 hidden md:block">
                    <h2 class="text-3xl font-bold text-white mb-6 text-center">Inscription</h2>

                    <form id="signup-form" class="space-y-4">
                        <div>
                            <label for="signup-name" class="block text-sm font-semibold text-white">Nom et Prénom</label>
                            <input type="text" id="signup-name" name="name" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-accent focus:border-accent">
                        </div>
                        <div>
                            <label for="signup-email" class="block text-sm font-semibold text-white">Adresse Email</label>
                            <input type="email" id="signup-email" name="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-accent focus:border-accent">
                        </div>
                        <div>
                            <label for="signup-password" class="block text-sm font-semibold text-white">Mot de Passe (min. 6 caractères)</label>
                            <input type="password" id="signup-password" name="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Message d'erreur/succès pour l'inscription -->
                        <div id="signup-message" class="text-center p-3 rounded-lg text-sm hidden border-l-4 mt-4 text-white" role="alert"></div>

                        <button type="submit" id="signup-button" class="w-full bg-accent text-white font-semibold py-3 rounded-lg shadow-md hover-accent transition duration-300 transform hover:scale-[1.01] mt-6">
                            Créer un Compte
                        </button>
                    </form>

                    <div class="mt-6 text-center md:hidden">
                        <p class="text-sm text-gray-100">
                            Déjà membre ? 
                            <button id="show-login-btn-mobile" class="text-accent font-semibold hover:underline transition duration-300">
                                Connectez-vous.
                            </button>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- PIED DE PAGE -->
    <footer class="w-full bg-brand-dark border-t border-gray-700 py-6">
        <p class="text-center text-sm text-gray-400">&copy; 2025 MindCompta. Tous droits réservés.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Setup ---
        
        setLogLevel('debug');
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');

        let auth;
        let db;

        if (Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } else {
            console.error("Firebase config is missing.");
        }
        
        // --- DOM Elements ---
        const elements = {
            loginSection: document.getElementById('login-section'),
            signupSection: document.getElementById('signup-section'),
            loginForm: document.getElementById('login-form'),
            signupForm: document.getElementById('signup-form'),
            loginMessage: document.getElementById('login-message'),
            signupMessage: document.getElementById('signup-message'),
            loginButton: document.getElementById('login-button'),
            signupButton: document.getElementById('signup-button'),
            formContainer: document.getElementById('form-container'),
            // Navigation Mobile
            mobileMenu: document.getElementById('mobile-menu'),
            overlay: document.getElementById('mobile-menu-overlay'),
            menuButton: document.getElementById('menu-button'),
            closeMenuButton: document.getElementById('close-menu-button'),
            showSignupBtnDesktop: document.getElementById('show-signup-btn-desktop'),
            showLoginBtnMobile: document.getElementById('show-login-btn-mobile')
        };


        // --- Utility Functions ---

        // Affiche un message d'état
        function showMessage(element, message, isSuccess) {
            element.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-500', 'bg-vibrant-green/20', 'text-brand-dark', 'border-vibrant-green', 'text-white');
            element.textContent = message;
            
            if (isSuccess) {
                element.classList.add('bg-vibrant-green/20', 'text-brand-dark', 'border-vibrant-green');
            } else {
                element.classList.add('bg-red-100', 'text-red-700', 'border-red-500');
            }
            
            // Adjust text color for the signup section background
            if (element === elements.signupMessage) {
                 element.classList.add('text-white');
                 element.classList.remove('text-brand-dark');
                 if (isSuccess) element.classList.add('border-vibrant-green');
                 else element.classList.add('border-red-500');
            }
        }
        
        function setButtonLoadingState(button, isLoading, originalText) {
            button.disabled = isLoading;
            button.textContent = isLoading ? 'Chargement...' : originalText;
            button.classList.toggle('opacity-50', isLoading);
            button.classList.toggle('cursor-not-allowed', isLoading);
        }


        // --- CORE FIREBASE LOGIC ---

        /**
         * Sauvegarde le profil de l'utilisateur (nom, email, rôle) dans Firestore
         * Le chemin suit la structure sécurisée: /artifacts/{appId}/users/{userId}/users_data/profile
         * @param {string} userId - L'UID de l'utilisateur nouvellement créé
         * @param {string} userName - Le nom complet de l'utilisateur
         * @param {string} userEmail - L'email de l'utilisateur
         * @param {string} role - Le rôle ('user' par défaut)
         */
        async function saveUserProfile(userId, userName, userEmail, role = 'user') {
            if (!db || !userId) return;

            // Chemin du document: /artifacts/{appId}/users/{userId}/users_data/profile
            const profileDocPath = `/artifacts/${appId}/users/${userId}/users_data/profile`;
            const userDocRef = doc(db, profileDocPath);
            
            const userData = {
                userName: userName,
                email: userEmail,
                role: role,
                createdAt: new Date()
            };

            try {
                // Utilise setDoc avec l'UID comme ID du document pour un accès facile
                await setDoc(userDocRef, userData);
                console.log("Profil utilisateur sauvegardé avec succès dans Firestore.");
            } catch (e) {
                console.error("Erreur lors de la sauvegarde du profil:", e);
                // Note: L'utilisateur est créé dans Auth, mais le profil Firestore a échoué.
                // Cela sera géré lors de la connexion.
            }
        }

        // 1. GESTION DE L'INSCRIPTION (Firebase)
        elements.signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const name = document.getElementById('signup-name').value;
            
            setButtonLoadingState(elements.signupButton, true, 'Créer un Compte');
            elements.signupMessage.classList.add('hidden');

            try {
                // Étape 1: Créer l'utilisateur dans Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Étape 2: Sauvegarder le profil dans Firestore
                await saveUserProfile(user.uid, name, email);

                // Succès et redirection
                showMessage(elements.signupMessage, `Compte créé avec succès pour ${name} ! Redirection...`, true);

                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirection vers le tableau de bord
                }, 1000);

            } catch (error) {
                let errorMessage;
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = "Cette adresse email est déjà utilisée.";
                        break;
                    case 'auth/invalid-email':
                        errorMessage = "Adresse email invalide.";
                        break;
                    case 'auth/weak-password':
                        errorMessage = "Mot de passe trop faible (doit contenir au moins 6 caractères).";
                        break;
                    default:
                        errorMessage = `Erreur d'inscription: ${error.message}`;
                }
                showMessage(elements.signupMessage, errorMessage, false);
                console.error("Erreur d'inscription Firebase:", error);
            } finally {
                setButtonLoadingState(elements.signupButton, false, 'Créer un Compte');
            }
        });


        // 2. GESTION DE LA CONNEXION (Firebase)
        elements.loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            setButtonLoadingState(elements.loginButton, true, 'Se Connecter');
            elements.loginMessage.classList.add('hidden');

            try {
                // Tenter la connexion
                await signInWithEmailAndPassword(auth, email, password);

                // Succès (onAuthStateChanged dans index.html prendra le relais)
                showMessage(elements.loginMessage, 'Connexion réussie ! Redirection...', true);

                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirection vers le tableau de bord
                }, 1000);

            } catch (error) {
                let errorMessage;
                switch (error.code) {
                    case 'auth/invalid-credential':
