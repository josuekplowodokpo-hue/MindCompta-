<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCompta - Authentification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { --brand-dark: #1E3A8A; --accent: #F59E0B; font-family: 'Inter', sans-serif; }
        .bg-brand-dark { background-color: var(--brand-dark); }
        .text-brand-dark { color: var(--brand-dark); }
        .bg-accent { background-color: var(--accent); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="w-full bg-brand-dark py-4 shadow-xl text-white sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center group">
                <img src="logo.jpg" alt="Logo" onerror="this.src='https://placehold.co/40x40/1E3A8A/ffffff?text=MC'" 
                     class="h-10 w-10 rounded-full mr-3 border-2 border-white object-cover">
                <span class="text-xl font-bold tracking-wider">MindCompta Finance</span>
            </a>
            <nav class="hidden sm:flex items-center space-x-4">
                <a href="index.html" class="hover:text-accent transition">Accueil</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-xl shadow-2xl p-8"> 
            <h2 id="form-title" class="text-3xl font-bold text-brand-dark mb-6 text-center">Connexion</h2>

            <button id="google-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 py-3 rounded-lg mb-6 hover:bg-gray-50 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#fbc02d" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    <path fill="#e53935" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                    <path fill="#4caf50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                    <path fill="#1565c0" d="M43.611,20.083L43.595,20L42,20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                </svg>
                <span class="text-gray-700 font-semibold">Continuer avec Google</span>
            </button>

            <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">Ou</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Adresse Email</label>
                    <input type="email" id="auth-email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mot de Passe</label>
                    <input type="password" id="auth-password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-accent outline-none">
                </div>

                <div id="auth-message" class="text-center p-3 rounded-lg text-sm hidden border-l-4 mt-4"></div>

                <button type="submit" id="auth-button" class="w-full bg-brand-dark text-white font-semibold py-3 rounded-lg shadow-md hover:opacity-90 transition mt-6 uppercase tracking-wider">
                    Se Connecter
                </button>
            </form>

            <div class="mt-6 text-center text-sm">
                <p id="switch-container" class="text-gray-600">
                    Pas encore de compte ? 
                    <button id="switch-button" class="text-brand-dark font-semibold hover:underline">Créer un compte</button>
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            setPersistence, 
            browserSessionPersistence 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvNz0MV5IqgJgnZqlBq1K66QFHBIVSGk0",
            authDomain: "mindcompta-a61ef.firebaseapp.com",
            projectId: "mindcompta-a61ef",
            storageBucket: "mindcompta-a61ef.firebasestorage.app",
            messagingSenderId: "578389020450",
            appId: "1:578389020450:web:edf9dd48e394cff7601f7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignInMode = true;

        // Message Helper
        function showMsg(text, isSuccess) {
            const msg = document.getElementById('auth-message');
            msg.innerText = text;
            msg.className = `text-center p-3 rounded-lg text-sm border-l-4 mt-4 ${isSuccess ? 'bg-green-100 text-green-700 border-green-500' : 'bg-red-100 text-red-700 border-red-500'}`;
            msg.classList.remove('hidden');
        }

        // 1. GOOGLE LOGIN AVEC PERSISTANCE SESSION
        document.getElementById('google-btn').onclick = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await setPersistence(auth, browserSessionPersistence);
                const res = await signInWithPopup(auth, provider);
                await setDoc(doc(db, "artifacts", res.user.uid), {
                    uid: res.user.uid,
                    email: res.user.email,
                    displayName: res.user.displayName,
                    status: "EN LIGNE",
                    lastLogin: serverTimestamp()
                }, { merge: true });
                window.location.href = 'index.html';
            } catch (err) { showMsg(err.message, false); }
        };

        // 2. EMAIL LOGIN AVEC PERSISTANCE SESSION
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-button');

            btn.disabled = true;
            btn.innerText = "Patientez...";

            try {
                await setPersistence(auth, browserSessionPersistence);
                if (isSignInMode) {
                    const res = await signInWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "artifacts", res.user.uid), { status: "EN LIGNE", lastLogin: serverTimestamp() }, { merge: true });
                } else {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "artifacts", res.user.uid), {
                        uid: res.user.uid, email, role: "Client", createdAt: serverTimestamp()
                    });
                }
                window.location.href = 'index.html';
            } catch (err) { 
                showMsg("Erreur d'identifiants ou réseau.", false);
                btn.disabled = false;
                btn.innerText = isSignInMode ? "Se Connecter" : "S'inscrire";
            }
        };

        // SWITCH MODE
        document.getElementById('switch-button').onclick = () => {
            isSignInMode = !isSignInMode;
            document.getElementById('form-title').innerText = isSignInMode ? "Connexion" : "Inscription";
            document.getElementById('auth-button').innerText = isSignInMode ? "Se Connecter" : "S'inscrire";
            document.getElementById('switch-container').innerHTML = isSignInMode ? 
                `Pas encore de compte ? <button id="switch-button" class="text-brand-dark font-semibold hover:underline">Créer un compte</button>` :
                `Déjà un compte ? <button id="switch-button" class="text-brand-dark font-semibold hover:underline">Se connecter</button>`;
            // Re-bind because innerHTML destroys the element
            window.location.reload(); 
        };
    </script>
</body>
</html>
